110,"originalSourceNo":632,"displayNo":110,"vi":"KHUNG ẢNH THỦY TINH ĐỒ DỄ VỠ\nVào dọn rác giúp tôi. Nhiều rác phải dọn thật đấy.\nĐúng không? Khi nào Giám đốc Han Na đến công ty thì báo tôi.\nCô Su Jeong. Vâng?\nKhi nào Giám đốc Han Na đến công ty thì báo tôi ngay nhé.\nVâng ạ. Thưa Giám đốc…","ko":"고아인: 들어와서 쓰레기 좀 치우세요\n고아인: 정리해야 될 쓰레기들이 참 많아. 그렇죠? \n고아인: 한나 상무님 출근하면 바로 알려 주세요\n고아인: 수정 씨? 네? 한나 상무님 출근하면 나한테 바로 알려 달라고요\n정수정: 네. 저기, 상무님…","en":"GLASS PICTURE FRAME\nCome and clean up the trash.\nThere are so many pieces of trash to clean. Wouldn't you agree?\nLet me know when Ms. Kang comes to work.\nSu-jeong. Yes, ma'am. Ms. Go…","start":2058.359891,"end":2097.398626,"viStart":2002.271832,"viEnd":2063.272033,"koStart":2058.359891,"koEnd":2097.398626,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2002.271832,"end":2063.272033},"koRange":{"start":2058.359891,"end":2097.398626}},{"id":111,"sourceUid":"merged-mv6jzfj0-20","sourceNo":111,"originalSourceNo":593,"displayNo":111,"vi":"[Thở dài] [Tiếng mở cửa]\n[Tiếng đóng cửa] [Thở dài]\n[Phát nhạc êm dịu]","ko":"[영우의 편안한 소리]\n[영우의 시원한 숨소리]\n[한숨][노크 소리]\n[한숨] [문 열리는 소리]\n[문 닫히는 소리][한숨]\n[차분한 음악이 흘러나온다]","en":"[Sigh] [Sound of door opening]\n[Sound of door closing] [Sigh]\n[Calm music plays]","start":2124.28,"end":2126.2,"viStart":2124.28,"viEnd":2126.2,"koStart":2124.28,"koEnd":2126.2,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":112,"sourceUid":"merged-mv6l4bzz-6","sourceNo":112,"originalSourceNo":603,"displayNo":112,"vi":"Mới sáng ra cô đã làm gì chăm chú thế?\nTôi đang huấn luyện tâm trí.\nCô đang đọc sách à? Tôi đâu có điên.\nSách vở toàn thứ nhàm chán.\nVậy cô đang làm gì? Cô làm sao vậy?\nCó sao đâu. Tôi đâu có cho người khác xem.\nDù cô xem một mình cũng vậy.\nGì vậy chứ, cô đâu phải trẻ con.","ko":"박영우: 아침부터 뭘 그렇게 열심히 하세요?\n강한나: 심신 수련 중\n박영우: 책이라도 읽으세요?\n강한나: 미쳤어? 그 지루한 걸 내가 왜 봐\n박영우: 그럼 뭐 보시는데요?\n박정숙: 아, 왜 이러세요, 진짜\n강한나: 뭐, 이게 어때서?\n강한나: 남들 보여 주는 것도 아닌데\n박영우: 아니, 아무리 혼자 보는 거라도, 하…\n박영우: 이게 뭐예요, 이게, 애도 아니고","en":"What are you up to so early in the morning?\nTraining my mind. So you're reading?\nI'm not crazy. Books are boring.\nThen what? What's wrong with you?\nThis is nothing. It's not like I'm showing it to everyone.\nI know you're not. But come on, you're not a child.","start":2113.002651,"end":2143.942653,"viStart":2077.951306,"viEnd":2110.061601,"koStart":2113.002651,"koEnd":2143.942653,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2077.951306,"end":2110.061601},"koRange":{"start":2113.002651,"end":2143.942653}},{"id":113,"sourceUid":"merged-mv6l6qud-13","sourceNo":113,"originalSourceNo":614,"displayNo":113,"vi":"GO A IN Đây là cách giải tỏa căng thẳng của riêng tôi.\nTôi xả bực rồi mới làm việc được.\nHay anh muốn tôi dồn nén tức giận rồi trực tiếp dội lên đầu chị ta?\nAnh muốn tôi làm vậy hả?\nSteve Jobs sẽ đau khổ lắm khi thấy thứ này.\nTại sao? Ông ấy đâu có làm ra chiếc máy này để dùng cho mục đích này.\nTôi bỏ tiền túi ra mua, dùng thế nào là việc của tôi. Có vấn đề gì à?","ko":"강한나: 아, 나만의 스트레스 해소법인데 왜, 뭐\n강한나: 이렇게라도 내 안의 화를 풀어야 일을 하지\n강한나: 그럼 꾹꾹 쌓아 뒀다가 면전에 대고 이 화를 쏟아부을까?\n강한나: 그랬으면 좋겠어?\n박영우: 스티브 잡스가 지하에서 통곡을 하겠네요\n박영우: 왜? 그게 그런 데 그렇게 쓰라고 개발한 게 아닐 텐데\n강한나: 내 돈 주고 사서 내 마음대로 쓴다는데 뭐가 어때서?","en":"GO A IN This is my way of blowing off steam.\nIf I don't, I wouldn't be able to work.\nOr should I bottle up my anger and just let it out on her directly?\nIs that what you want?\nSteve Jobs will be devastated to see this.\nWhy? This wasn't developed for this kind of use.\nI bought this with my own money for my personal use. So it's fine.","start":2147.94229,"end":2169.477716,"viStart":2110.061601,"viEnd":2134.987768,"koStart":2147.94229,"koEnd":2169.477716,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2110.061601,"end":2134.987768},"koRange":{"start":2147.94229,"end":2169.477716}},{"id":114,"sourceUid":"merged-mv6l4s74-8","sourceNo":114,"originalSourceNo":605,"displayNo":114,"vi":"[Âm nhạc thú vị]\n[Tiếng cốc nước được đặt xuống]","ko":"[흥미로운 음악]\n[잔 탁 내려놓는 소리]","en":"[Interesting music]\n[Sound of a glass being set down]","start":2169.75,"end":2171.04,"viStart":2169.75,"viEnd":2171.04,"koStart":2169.75,"koEnd":2171.04,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":115,"sourceUid":"merged-mv6tr234-17","sourceNo":115,"originalSourceNo":627,"displayNo":115,"vi":"Được thôi. Cô cứ tùy ý dùng đi.\nNgười tiêu dùng có… Trợ lý Park, anh có nghe tôi nói không đó?\nCó nghe không đó? Tôi đang nghe đây.\nAnh đâu có nghe tôi. Anh đang uống cà phê mà.\nTôi có uống bằng tai đâu? Cô nói tiếp đi.\nNgười tiêu dùng có quyền sử dụng sản phẩm theo nhu cầu cá nhân…\nChết tiệt. Quên mất rồi.\nCô cứ từ từ nhớ ra đi. Tôi không vội đâu.","ko":"박영우: 네, 쓰세요, 마음껏\n강한나: 소비자가 자기 뜻대로…\n강한나: 박 차장, 내 말 듣고 있어? 듣고 있냐고\n박영우: 듣고 있습니다\n강한나: 안 듣는 거 같은데?\n강한나: 커피 마시고 있는 거 같은데?\n박영우: 커피를 귀로 먹나요\n박영우: 하세요\n강한나: 소비자가 자기 뜻대로 니즈에 맞춰서\n강한나: 아씨, 까먹었잖아\n박영우: 천천히 하세요, 천천히 어디 안 가니까","en":"Of course. Use it all you want.\nConsumers have…\nMr. Park. Are you listening to me?\nHello? I am. I don't think so. You're drinking your coffee.\nI can listen while I drink it.\nGo ahead. Consumers have the right to use a product based on their needs…\nDarn it. I forgot. Take your time. I'm not going anywhere.","start":2169.477716,"end":2201.772969,"viStart":2134.987768,"viEnd":2167.666641,"koStart":2169.477716,"koEnd":2201.772969,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2134.987768,"end":2167.666641},"koRange":{"start":2169.477716,"end":2201.772969}},{"id":116,"sourceUid":"merged-mv6kd0zu-22","sourceNo":116,"originalSourceNo":623,"displayNo":116,"vi":"[thở dài]\n[Âm thanh buông tay]","ko":"[한숨]\n[잘그랑 놓는 소리]","en":"[sigh]\n[Sound of letting go]","start":2213.12,"end":2214.33,"viStart":2213.12,"viEnd":2214.33,"koStart":2213.12,"koEnd":2214.33,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":117,"sourceUid":"merged-mv6uqunh-25","sourceNo":117,"originalSourceNo":633,"displayNo":117,"vi":"Người tiêu dùng có quyền sử dụng sản phẩm theo nhu cầu cá nhân… Trợ lý Park!\nGiám đốc Kang đến văn phòng rồi ạ.\nĐược rồi. Thưa Giám đốc. Sao?\nTôi có chuyện muốn nói với chị.\nTôi biết. Nhưng vẫn chưa đến lúc mà, phải không?\nSao ạ? Cô cứ đong đếm thêm đi.\nXem giữa tôi và Giám đốc Choi, cô nên chọn ai để dễ lên vị trí chính chức hơn? Sao cơ ạ?","ko":"강한나: 소비자가 자기 뜻대로 니즈에 맞춰… 박 차장!\n정수정, 고아인: 한나 상무님 출근하셨습니다. 그래요. 저기, 상무님. 응?\n정수정, 고아인: 드릴 말씀이 있는데요. 알아. 아직은 때가 아니지, 안 그래?\n고아인: 네? 저울질 좀 더 해야지\n고아인: 최 상무랑 나 누구한테 붙어야 정직원 될 수 있을지. 네?","en":"Consumers have the right to use a product based on their needs… Mr. Park! Ms. Kang is in her office.\nAll right. Ms. Go. Sao? Yes?\nI have something to tell you. I know.\nBut this isn't the right time, don't you think? Sorry?\nKeep weighing your options.\nMe or Mr. Choi? Who has the better odds of winning so you can get a permanent job? I'm sorry?","start":2201.772969,"end":2261.917369,"viStart":2167.666641,"viEnd":2226.034419,"koStart":2201.772969,"koEnd":2261.917369,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2167.666641,"end":2226.034419},"koRange":{"start":2201.772969,"end":2261.917369}},{"id":118,"sourceUid":"ko-muwto5lp-1607","sourceNo":118,"originalSourceNo":646,"displayNo":118,"vi":"[Hiệu ứng âm thanh tối]","ko":"[어두운 효과음]","en":"[Dark sound effect]","start":2287.91,"end":2289.41,"viStart":2287.91,"viEnd":2289.41,"koStart":2287.91,"koEnd":2289.41,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":119,"sourceUid":"merged-mv6v48ir-35","sourceNo":119,"originalSourceNo":660,"displayNo":119,"vi":"Cô đã làm thư ký vài lần, mỗi lần hai năm.\nVâng, tôi là nhân viên hợp đồng.\nQuê cô ở… HỒ SƠ TÊN: JUNG SU JEONG. Chà, xa quá nhỉ.\nChắc cô đang sống một mình.\nCô trả tiền nhà theo tháng hay theo năm?\nTheo tháng ạ.\nTrừ hết các khoản sinh hoạt phí rồi, chắc cô chả còn tiền để tiết kiệm.\nVâng, đúng là vậy.\nCô có muốn làm nhân viên chính thức ở công ty này không?\nVậy thì tốt cho tôi quá.\nNhưng tôi nghe nói thư ký của ban giám đốc đều là nhân viên hợp đồng.","ko":"최창수: 비서를 여러 번 했네? 2년씩?\n정수정: 아, 네, 계약직이라\n최창수: 음, 고향이… 아이고, 멀구나\n최창수: 혼자 살겠네. 월세? 아님 전세?\n정수정: 월세 삽니다\n최창수: 계약직 월급으로 이거저거 내고 나면 적금도 하나 못 넣겠다\n정수정: 아, 네, 뭐…\n최창수: 우리 회사에서 정직원 하는 건 어때?\n정수정: 아, 저야 좋죠\n정수정: 근데 그… 임원분들 비서는 다 계약직 쓰는 걸로 알고 있는데","en":"You've been a secretary a few times for two years each.\nYes, I was a contract worker.\nAnd you are from… RESUME NAME: JUNG SU-JEONG. It's quite far.\nYou must live alone. Are you paying monthly rent or is it a lump-sum deposit?\nMonthly.\nAfter paying off your expenses, you probably can't even save up.\nThat's true.\nHow about you get a permanent job here?\nThat'd be great.\nBut aren't all secretaries for executives under temporary contracts?","start":2275.465492,"end":2313.530966,"viStart":2240.515115,"viEnd":2278.450806,"koStart":2275.465492,"koEnd":2313.530966,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2240.515115,"end":2278.450806},"koRange":{"start":2275.465492,"end":2313.530966}},{"id":120,"sourceUid":"merged-mv8678lg-3","sourceNo":120,"originalSourceNo":668,"displayNo":120,"vi":"Thư ký của ban giám đốc đúng là nhân viên hợp đồng,\nnhưng của tổng giám đốc là nhân viên chính thức.\nCô hãy hỗ trợ công việc cho tôi, rồi một năm sau,\nhãy làm thư ký cho tôi.\nThư ký tổng giám đốc.\nThực ra, tôi có thể hiểu được.\nLà tôi, tôi cũng làm vậy.\nNhưng tôi hiểu được, không có nghĩa là tôi chấp nhận được.","ko":"최창수: 임원 비서야 계약직으로 쓰지\n최창수: 대표 비서를 정직원으로 쓰고\n최창수: 내 일 좀 돕고 1년 후에 내 비서 하면 되잖아 대표 비서\n고아인: 뭐, 이해는 돼\n고아인: 나라도 그랬을 테니까\n고아인: 근데 이해가 된다고 용납이 되는 건 아니지?","en":"That is the case for secretaries for executives.\nBut it's different for the secretary of the CEO.\nHelp me with my job, and a year later,\nyou can become my secretary.\nA secretary of the CEO.\nWell, I understand what you did.\nI would've done the same.\nBut just because I understand it, doesn't mean I can allow it.","start":2313.530966,"end":2345.627171,"viStart":2278.450806,"viEnd":2310.894888,"koStart":2313.530966,"koEnd":2345.627171,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2278.450806,"end":2310.894888},"koRange":{"start":2313.530966,"end":2345.627171}},{"id":121,"sourceUid":"merged-mv867sny-4","sourceNo":121,"originalSourceNo":669,"displayNo":121,"vi":"[âm nhạc đen tối]","ko":"[어두운 음악]","en":"[dark music]","start":2367.9,"end":2369.57,"viStart":2367.9,"viEnd":2369.57,"koStart":2367.9,"koEnd":2369.57,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":122,"sourceUid":"merged-mv86go0l-14","sourceNo":122,"originalSourceNo":684,"displayNo":122,"vi":"Cô tự tìm câu trả lời ở mình đi.\nSao ạ? Chị nói vậy là sao?\nNếu cô là tôi, cô sẽ làm gì?\nXin lỗi chị, Giám đốc Go. Tôi chỉ làm theo chỉ thị thôi.\nTôi rất muốn sa thải cô ngay lập tức.\nGiám đốc Go.\nNhưng cô đâu có quyền lực gì. Nên cô hãy chứng minh đi.\nVâng. Từ nay tôi sẽ không báo cáo cho Giám đốc Choi nữa.\nKhông, cứ làm như mọi khi đi. Phải vậy anh ta mới an tâm.\nVậy… Chứng minh cho tôi thấy cô có ích đi.","ko":"고아인: 답은 너 자신한테 물어봐\n정수정: 네? 제가 뭘…\n고아인: 네가 나라면 어떻게 할지\n서은자: 상무님, 죄송합니다. 전 그냥 시키는 대로…\n고아인: 마음 같아선 이 시간부로 해고지만\n서은자: 상무님…\n고아인: 네가 무슨 힘이 있겠니. 그러니까 증명해 봐\n서은자: 네, 이제부턴 최 상무님한테 보고 안 할게요\n고아인: 아니, 평소대로 해. 그래야 최 상무가 안심하지\n고아인: 그럼… 네가 나한테 쓸모 있는 사람이라는 걸 증명해 봐","en":"You can answer the question yourself.\nSorry? What do you mean?\nWhat would you do if you were me?\nI'm sorry, Ms. Go. All I did was follow his orders.\nI want to fire you on this spot.\nMs. Go, please.\nBut I know you're powerless. So prove yourself.\nOkay. I will stop reporting to Mr. Choi.\nNo, just behave normally. So that he feels at ease.\nThen… Prove to me that you're useful.","start":2355.135919,"end":2394.52703,"viStart":2320.256793,"viEnd":2359.89421,"koStart":2355.135919,"koEnd":2394.52703,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2320.256793,"end":2359.89421},"koRange":{"start":2355.135919,"end":2394.52703}},{"id":123,"sourceUid":"merged-mv86japu-15","sourceNo":123,"originalSourceNo":686,"displayNo":123,"vi":"Đừng giở chiêu trò bẩn thỉu như Giám đốc Choi.\nHãy dùng năng lực ấy.","ko":"고아인: 최 상무가 시킨 이런 지저분한 방법 말고\n서은자: 네 능력으로","en":"Do it without using any dirty tricks like Director Choi,\nbut with your skills.","start":2394.52703,"end":2399.342268,"viStart":2359.89421,"viEnd":2366.244879,"koStart":2394.52703,"koEnd":2399.342268,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2359.89421,"end":2366.244879},"koRange":{"start":2394.52703,"end":2399.342268}},{"id":124,"sourceUid":"merged-mv6v5ydj-36","sourceNo":124,"originalSourceNo":690,"displayNo":124,"vi":"[Tiếng mở cửa]\n[Tiếng đóng cửa]\n[Tiếng gõ cửa]","ko":"[문 열리는 소리]\n[문 닫히는 소리]\n[노크 소리]","en":"[Sound of door opening]\n[Sound of door closing]\n[Knocking sound]","start":2440.56,"end":2441.81,"viStart":2440.56,"viEnd":2441.81,"koStart":2440.56,"koEnd":2441.81,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":125,"sourceUid":"merged-mv870jjp-21","sourceNo":125,"originalSourceNo":699,"displayNo":125,"vi":"Giám đốc Go đến ạ.\nĐể làm gì? Cô đích thân ra gặp thử xem sao.\nCô nên bắt đầu làm việc rồi.\nTôi đã bắt đầu làm việc từ hôm qua rồi.\nNói xấu sau lưng tôi không thể tính là việc được.\nKhi phó tổng giám đốc ở trụ sở chính…\nÀ không. Hồi anh trai cô mới đến công ty, cánh báo chí đã xếp hàng dài để đợi phỏng vấn anh ấy đó.","ko":"박영우: 고 상무님 오셨습니다\n강한나: 왜?\n박영우: 직접 만나 보고 확인하시죠\n고아인: 이제 일 좀 하셔야죠\n강한나: 일이야 어제부터 하고 있었죠\n고아인: 제 욕 하는 건 업무에 포함 안 될 텐데요\n고아인: 본사 부사장님\n고아인: 아니, 오빠분 첫 출근 때는\n고아인: 언론사 인터뷰다 뭐다 홍보 엄청 많이 하던데","en":"Ms. Go is here.\nWhy? You should meet her and find out.\nYou should start working now.\nI've been working since yesterday.\nTalking behind my back isn't work.\nWhen the vice president of HQ, I mean…\nWhen your brother first came to work, reporters were lined up to interview him.","start":2423.880521,"end":2453.473016,"viStart":2388.701419,"viEnd":2419.681773,"koStart":2423.880521,"koEnd":2453.473016,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2388.701419,"end":2419.681773},"koRange":{"start":2423.880521,"end":2453.473016}},{"id":126,"sourceUid":"merged-mv87efai-30","sourceNo":126,"originalSourceNo":707,"displayNo":126,"vi":"Nhưng lần này lại không như vậy.\nRồi chị muốn làm gì?\nCô muốn ngồi không vậy thôi hay muốn làm gì đó nào?\nTrước tiên, cô xem cái này đi rồi bàn bạc.\nTôi đã xếp lịch phỏng vấn lúc 1:00 chiều.\nCô hãy trả lời theo nội dung trong kịch bản nhé.","ko":"고아인: 이번엔 그냥 넘어가는 분위기더라고요\n강한나: 그래서 어쩌라고요?\n고아인: 가만히 계실래요? 아니면 뭐 좀 하시겠어요?\n고아인: 일단 읽어 보고 이야기하시죠\n고아인: 1시에 언론사 인터뷰 잡아 놨습니다\n고아인: 거기 써 드린 대로 상무님이 인터뷰하세요","en":"But that's not the case this time.\nSo what?\nWill you just sit back and do nothing or will you do something?\nPlease look over this first and we'll talk.\nI arranged the interview for 1 p.m.\nDo the interview based on that material.","start":2453.473016,"end":2512.629391,"viStart":2419.681773,"viEnd":2480.352627,"koStart":2453.473016,"koEnd":2512.629391,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2419.681773,"end":2480.352627},"koRange":{"start":2453.473016,"end":2512.629391}},{"id":128,"sourceUid":"merged-mv87dniy-28","sourceNo":128,"originalSourceNo":705,"displayNo":128,"vi":"[Âm nhạc thú vị]\n[Hiệu ứng âm thanh nhấn mạnh]","ko":"[흥미로운 음악]\n[강조되는 효과음]","en":"[Interesting music]\n[Emphasis sound effect]","start":2521.68,"end":2522.93,"viStart":2521.68,"viEnd":2522.93,"koStart":2521.68,"koEnd":2522.93,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":129,"sourceUid":"merged-mv88jrwa-35","sourceNo":129,"originalSourceNo":714,"displayNo":129,"vi":"Tôi xin lỗi vì đã cắt ngang.\nAnh cứ nói thoải mái.\nTôi biết việc cô gửi email cho các khách hàng.\nRõ ràng cô đã gây hấn với một đối thủ không nên động tới.\nĐúng là vậy.\nGần như là trận chiến giữa người với thần.\nVậy tại sao Giám đốc Kang phải dọn dẹp mớ lộn xộn đó cho cô?","ko":"박영우: 저, 말씀 중에 죄송합니다\n고아인: 편하게 말씀하세요\n박영우: 고 상무님이 광고주들한테 보낸 메일\n박영우: 일종의 역린을 건드린 걸로 알고 있는데요\n고아인: 그렇죠\n고아인: 신에게 인간이 대항한 거죠\n박영우: 그걸 한나 상무님이 왜 수습해 드려야 할까요? 응","en":"I'm sorry to interrupt.\nFeel free to speak.\nBecause you sent out those emails to the clients,\nyou picked a fight with people you shouldn't have.\nThat's true.\nIt was as if a mere human went against the gods.\nSo why does Ms. Kang have to clean up after your mess?","start":2516.770167,"end":2539.820548,"viStart":2480.352627,"viEnd":2502.797616,"koStart":2516.770167,"koEnd":2539.820548,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2480.352627,"end":2502.797616},"koRange":{"start":2516.770167,"end":2539.820548}},{"id":130,"sourceUid":"merged-mv87367i-22","sourceNo":130,"originalSourceNo":718,"displayNo":130,"vi":"[Âm nhạc ý nghĩa]\n[Hơi thở sảng khoái]\n[Tiếng gõ cửa]\n[Trường Tô]","ko":"[의미심장한 음악]\n[개운한 숨소리]\n[노크 소리]\n[창수]","en":"[Meaningful music]\n[Refreshing breathing]\n[Knocking sound]\n[Changsu]","start":2579.11,"end":2580.03,"viStart":2579.11,"viEnd":2580.03,"koStart":2579.11,"koEnd":2580.03,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":131,"sourceUid":"merged-mv88sp5m-43","sourceNo":131,"originalSourceNo":730,"displayNo":131,"vi":"Vào đi.\nSao sáng ra anh đã gọi tôi rồi?\nCó tin tốt đây.\nTin tốt gì?\nGiám đốc marketing của các công ty con sắp đến rồi.\nĐể làm gì?\nVì email của giám đốc Go?\nNghĩa là… Phải chào mừng họ chứ.\nVì nếu để tôi xử lý, họ sẽ xem đó là sự cố.\nCòn nếu Giám đốc Kang ra mặt, đó sẽ là đổi mới.\nTình trạng tham nhũng đã kéo dài hàng thập kỷ khiến toàn ngành nao núng.","ko":"권우철: 아침부터 무슨 일로 부르셨어요?\n최창수: 좋은 일\n권우철: 무슨?\n최창수: 계열사 마케팅 임원분들 곧 오실 거야\n권우철: 왜요?\n권우철: 광고주들한테 보낸 메일 때문에요?\n최창수: 그럼… 환영해 드려야지\n고아인: 제가 수습하면 사고고\n고아인: 한나 상무님이 수습하면 혁신이니까요\n고아인: 수십 년간 업계 관행으로 고착되어 온 불합리한 적폐를","en":"Come in.\nWhy did you call me so early?\nI have good news.\nGood news?\nThe marketing executives of the subsidiaries will be coming soon.\nFor what?\nBecause of Director Go's email?\nThat means… We should welcome them.\nIt'll be an accident if I clean it up…\nbut an innovation if Ms. Kang cleans it up.\nDecades of built-up corruption formed malpractices within the industry.","start":2556.373492,"end":2599.631364,"viStart":2521.684992,"viEnd":2565.274652,"koStart":2556.373492,"koEnd":2599.631364,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2521.684992,"end":2565.274652},"koRange":{"start":2556.373492,"end":2599.631364}},{"id":132,"sourceUid":"merged-mv88s2yk-41","sourceNo":132,"originalSourceNo":726,"displayNo":132,"vi":"[Tiếng đóng cửa]\n[Nhạc đen tối][Woo-cheol]","ko":"[문 닫히는 소리]\n[어두운 음악][우철]","en":"[Sound of door closing]\n[Dark Music][Woo-cheol]","start":2599.72,"end":2602.34,"viStart":2599.72,"viEnd":2602.34,"koStart":2599.72,"koEnd":2602.34,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":133,"sourceUid":"merged-mv895og3-52","sourceNo":133,"originalSourceNo":741,"displayNo":133,"vi":"Và con gái chủ tịch, nói cách khác… nữ phó chủ tịch kế nhiệm của tập đoàn…\n\"Nữ… phó chủ tịch kế nhiệm\"? …đã tiến hành đổi mới ngay từ ngày đầu tiên đi làm,\nthể hiện dáng vẻ lãnh đạo hoàn toàn mới.\nDưới góc nhìn của chuyên gia trong ngành, cô ấy sẽ là đối thủ đáng gờm của anh trai, Phó Tổng giám đốc Kang Han Su,\ntrong cuộc chiến tranh giành\nchức phó chủ tịch tập đoàn.\nCông chúng đang rất mong chờ\nđộng thái tiếp theo của Giám đốc Kang.","ko":"고아인: 회장 딸, 즉 그룹의 내일을 이끌 차기 부회장이\n강한나: 차기…\n강한나: 부회장? 출근 첫날부터 혁신하며 새로운 리더십을 보였다\n고아인: 재계의 한 관계자에 따르면\n고아인: 부회장 자리를 두고 경쟁 중인 오빠 강한수 부사장의\n고아인: 강력한 라이벌의 등장이라고\n고아인: 긍정적으로 평가하며\n고아인: 강한나 상무의 행보를 주목하고 있다","en":"The chairman's daughter, in other words, the next vice chairwoman of the group…\n\"Next… vice chairwoman\"? …has opened her first day with such an innovation,\nproving herself to be a new kind of leader.\nAccording to an expert from the industry,\nthis would be a rise of a new rival against Vice President Kang Han-su\ncompeting for the position of the group's vice chairman.\nAnd many are looking forward to\nwhat she'll do in the future.","start":2600.060763,"end":2640.00489,"viStart":2565.274652,"viEnd":2606.591651,"koStart":2600.060763,"koEnd":2640.00489,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2565.274652,"end":2606.591651},"koRange":{"start":2600.060763,"end":2640.00489}},{"id":134,"sourceUid":"merged-mv89hpyf-61","sourceNo":134,"originalSourceNo":750,"displayNo":134,"vi":"[Âm nhạc sôi động]\n[Âm nhạc thú vị]\n[Hiệu ứng âm thanh ý nghĩa]","ko":"[흥미진진한 음악]\n[흥미로운 음악]\n[의미심장한 효과음]","en":"[Exciting music]\n[Interesting music]\n[Meaningful sound effects]","start":2708.49,"end":2710.7,"viStart":2708.49,"viEnd":2710.7,"koStart":2708.49,"koEnd":2710.7,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":135,"sourceUid":"merged-mv89gt8c-59","sourceNo":135,"originalSourceNo":749,"displayNo":135,"vi":"Tôi rất ưng quan điểm và thông điệp của cô.\nNhưng cô định lợi dụng cô ấy à?\nThay vì nói là lợi dụng, tôi thấy nên dùng từ \"có qua có lại\".\nTừ ngữ quyết định cảm xúc con người mà.\nCô thấy sao, Giám đốc Kang?\nGiám đốc Kang? Hả?\nPhải rồi. Chờ tôi chút.","ko":"박영우: 시점도 좋고 메시지도 좋은데\n박영우: 이용당하는 기분이네요\n고아인: 이용보다는…\n고아인: 뭐, 기브 앤 테이크가 적절하겠네요\n고아인: 단어가 기분을 결정하니까\n박영우: 상무님 생각은 어떠세요?\n박영우: 상무님? 응?\n강한나: 아, 어, 잠깐만","en":"The point of view and message are great.\nBut I feel that you're using her.\nRather than using anyone, it's more of a give-and-take situation.\nWords determine how you feel.\nWhat do you think, Ms. Kang?\nMs. Kang? Yes?\nRight. Hold on.","start":2643.62548,"end":2683.872176,"viStart":2606.591651,"viEnd":2650.156096,"koStart":2643.62548,"koEnd":2683.872176,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2606.591651,"end":2650.156096},"koRange":{"start":2643.62548,"end":2683.872176}},{"id":137,"sourceUid":"merged-mv89rr9z-72","sourceNo":137,"originalSourceNo":761,"displayNo":137,"vi":"Mình cảm nhận được. Chuyện tốt sắp xảy ra rồi.\nĐám người này… điên hết rồi sao?\nGọi giám đốc marketing cho tôi.\nNgay bây giờ! Mình phải cắt hết quảng cáo cho biết tay.\nSao họ dám so mình với con bé đó?\nChết tiệt! Mình thấy được cảnh Kang Han Su rất ghét việc này.\nÔi, nghe hấp dẫn quá.","ko":"강한나, 강한수: 온다. 느낌이 온다. 아, 이것들이 미쳤나\n강한수: 마케팅 담당 임원 좀 오라고 하세요. 당장!\n강한수: 광고를 끊어야 정신을 차리지?\n강한수: 감히 누구랑 누굴 비교해?\n강한나: 아유, 씨! 강한수가 싫어하는 게 보인다\n강한나: 아, 땡기는데","en":"I feel it. I feel something good is coming.\nHave they all lost their minds?\nHave the marketing executive come to my office. Now!\nI'll cut all their advertisements.\nHow dare they compare me to her?\nDarn it! I can see Kang Han-su hating this.\nGosh, I'm so tempted.","start":2690.381755,"end":2731.157346,"viStart":2655.164276,"viEnd":2696.472154,"koStart":2690.381755,"koEnd":2731.157346,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2655.164276,"end":2696.472154},"koRange":{"start":2690.381755,"end":2731.157346}},{"id":140,"sourceUid":"merged-mv8aky7d-79","sourceNo":140,"originalSourceNo":768,"displayNo":140,"vi":"Nhưng mình lại không hề muốn làm gì có lợi cho Go A In.\nChỉ có kẻ ngốc mới làm vậy thôi.\nGì cơ?\nKhông muốn người khác được lợi nên từ bỏ lợi ích của mình?\nNhưng việc như vậy chỉ những kẻ thất bại mới làm do mang tâm lý nạn nhân sinh ra từ sự tự ti mà thôi.\nNhỉ, Trợ lý Park?","ko":"강한나: 고아인 저거한테 이익 되는 건 절대 해 주기 싫고\n고아인: 그건 바보들이나 하는 선택이죠\n강한나: 뭐가요?\n고아인: 남한테 이익 되는 게 싫어서 자기 이익을 포기한다? 으음\n고아인: 그건 콤플렉스에서 발현된 피해 의식에 쩔어 사는\n고아인: 루저들이나 하는 짓이죠\n고아인: 안 그래요, 박 차장님?","en":"But I really don't want to do anything that benefits Go A-in.\nThat's what idiots would do.\nWhat?\nTo give up your own benefit so others won't benefit.\nThat's what\npeople with a victim mentality stemming from their inferiorities do.\nBasically, losers. Right, Mr. Park?","start":2731.157346,"end":2761.668466,"viStart":2696.472154,"viEnd":2727.627528,"koStart":2731.157346,"koEnd":2761.668466,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2696.472154,"end":2727.627528},"koRange":{"start":2731.157346,"end":2761.668466}},{"id":141,"sourceUid":"ko-muwto5lp-1730","sourceNo":141,"originalSourceNo":769,"displayNo":141,"vi":"[Âm nhạc thú vị]","ko":"[흥미로운 음악]","en":"[Interesting music]","start":2781.44,"end":2783.07,"viStart":2781.44,"viEnd":2783.07,"koStart":2781.44,"koEnd":2783.07,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":142,"sourceUid":"merged-mv942s44-88","sourceNo":142,"originalSourceNo":781,"displayNo":142,"vi":"Giám đốc Kang.\nCô có muốn ghen tị thì đợi đến lúc cô hẹn hò đi.\nVới tôi, cô chỉ cần tính toán được mất thôi.\nKhông gì thảm hơn việc chủ mà lại đi ghen tị với tôi tớ đâu.\nTính toán được mất sao?\nTôi thấy mình được gì rồi.\nVậy tôi sẽ mất những gì?\nHiện tại thì không mất gì cả.\nAnh nói chị ta lợi dụng tôi mà?\nTôi rút lại câu đó.","ko":"고아인: 상무님, 돈도 안 되는 질투는 연애할 때나 하시고\n고아인: 저랑은 손익 계산만 하시죠\n강근철: 주인이 머슴 질투하는 것만큼 흉한 거 없어야, 고럼\n고아인: 손익 계산이라…\n강한나: 이익은 보이는데\n강한나: 나한테 올 손해는?\n박영우: 없습니다, 현재로선\n강한나: 이용당하는 느낌이라며?\n박영우: 그 말 취소하겠습니다","en":"Ms. Kang.\nYou can save your jealousy for romantic relationships.\nJust calculate your benefits with me.\nIt's the most pathetic when an owner is jealous of a servant.\nBenefits, you say.\nI can see the benefits.\nBut what will I lose?\nCurrently, nothing.\nBut you said she's using me.\nI take that back.","start":2767.479274,"end":2801.751249,"viStart":2727.627528,"viEnd":2767.885138,"koStart":2767.479274,"koEnd":2801.751249,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2727.627528,"end":2767.885138},"koRange":{"start":2767.479274,"end":2801.751249}},{"id":143,"sourceUid":"merged-mv94d58k-93","sourceNo":143,"originalSourceNo":790,"displayNo":143,"vi":"Kèo này thực sự rất minh bạch.\nCô cứ quyết theo kiểu cô đi.\nTôi là kiểu người thế nào?\nKiểu người chuyên đóng vai kẻ bất cần,\nnhưng bản năng bên trong hiểu rất rõ điều gì là có lợi.\nAnh đừng trao đổi gì với đội PR ở trụ sở chính.\nTôi biết rồi.\nĐể tôi chuẩn bị.","ko":"박영우: 주고받을 게 명확한 거래니까요\n고아인: 한나 상무님 스타일대로 가세요\n강한나: 제가 어떤 스타일인데요?\n고아인: 겉으로는 망나니 코스프레 하지만\n고아인: 자기한테 이익이 되는 건 본능적으로 아는 스타일?\n권우철: 본사 홍보 팀이랑은 커뮤니케이션하지 마시고요\n박영우: 알겠습니다\n박영우: 준비하겠습니다","en":"The trade is crystal clear.\nJust be yourself and decide.\nAnd what kind of person am I?\nYou act flaky on the outside,\nbut you instinctively know what benefits you.\nDon't communicate this to the PR team at the HQ.\nYes, ma'am.\nI'll prepare.","start":2801.751249,"end":2845.609055,"viStart":2767.885138,"viEnd":2811.449,"koStart":2801.751249,"koEnd":2845.609055,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2767.885138,"end":2811.449},"koRange":{"start":2801.751249,"end":2845.609055}},{"id":144,"sourceUid":"merged-mv94dbuz-94","sourceNo":144,"originalSourceNo":791,"displayNo":144,"vi":"[âm nhạc đen tối]\n[Âm thanh mở và đóng cửa]","ko":"[어두운 음악]\n[문 여닫히는 소리]","en":"[dark music]\n[Sound of door opening and closing]","start":2873.37,"end":2875.58,"viStart":2873.37,"viEnd":2875.58,"koStart":2873.37,"koEnd":2875.58,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":145,"sourceUid":"merged-mv94qo4d-100","sourceNo":145,"originalSourceNo":800,"displayNo":145,"vi":"Tôi có nên xuống sảnh đón họ không?\nĐám nhân viên nghĩ thế nào về email mà Go A In gửi khách?\nThực ra, tụi nó thích dữ lắm.\nLắm lúc khách cũng lộng hành mà.\nVậy cậu định để khách hàng biết chuyện đó sao?\nHay cậu muốn biến điều đó thành\nhành vi chống đối do một mình Go A In gây ra?","ko":"권우철: 제가 마중 나갈까요? 로비로?\n최창수: 고아인이 광고주들한테 보낸 메일\n최창수: 다들 어떻게 생각해?\n권우철: 사실 아, 좋아하죠 진짜 쓸모없는 갑질이었으니까\n최창수: 그럼 광고주한테 그렇게 보일래?\n최창수: 아님 고아인 혼자만의\n최창수: 독단적인 일탈 행위로 보이게 할래?","en":"Shall I go greet them in the lobby?\nWhat does everyone think of the email that Go A-in sent to the clients?\nHonestly, they love it.\nThey're tired of power trips.\nDo you want the clients to know everyone hates them?\nOr do you want to make it seem like this was\na rebellious action that Go A-in did by herself?","start":2860.221572,"end":2887.650143,"viStart":2811.449,"viEnd":2853.37,"koStart":2860.221572,"koEnd":2887.650143,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2811.449,"end":2853.37},"koRange":{"start":2860.221572,"end":2887.650143}},{"id":146,"sourceUid":"merged-mv94z5ir-109","sourceNo":146,"originalSourceNo":812,"displayNo":146,"vi":"Nếu cậu xuống sảnh đón họ,\ncậu cũng nên cho họ thấy nhân viên công ty\nkhông mấy ủng hộ email của Go A In chứ.\nTôi dán mấy tấm áp phích lên nhé?\nAnh muốn làm vậy để họ đổ lỗi cho Go A In phải không?\nTôi hiểu rồi. Tôi sẽ kêu copywriter viết mấy câu thật công kích.\nViệc hệ trọng như vậy, cậu đích thân làm đi. Lặng lẽ thôi.","ko":"권우철: 아! 로비로 마중 나간다며\n최창수: 최창수: 계열사 마케팅 임원분들 오시면\n최창수: 최창수: 내부 분위기 알아야 하지 않겠어?\n최창수: 최창수: 대자보 포스터 만들어 붙일까요?\n권우철: 권우철: 화를 편안하게 낼 수 있는 상황을 만들어 주라는 거죠?\n권우철: 권우철: 알겠습니다. 팀 카피들 시켜서 자극적으로 뽑을게요\n최창수: 최창수: 중요한 일은 직접 해야지. 조용히","en":"By greeting them in the lobby,\ndon't you want to show them that our employees\naren't supportive of the email that she sent out?\nShould I put up posters?\nYou want to make it so that they can take it out on her.\nAll right. I'll have our copywriters write a provocative one.\nYou should handle important matters yourself. Be discreet.","start":2887.650143,"end":2918.741272,"viStart":2853.37,"viEnd":2884.398677,"koStart":2887.650143,"koEnd":2918.741272,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2853.37,"end":2884.398677},"koRange":{"start":2887.650143,"end":2918.741272}},{"id":147,"sourceUid":"merged-mv94z0lr-108","sourceNo":147,"originalSourceNo":811,"displayNo":147,"vi":"[Âm nhạc thú vị]\n[Hiệu ứng âm thanh tối]","ko":"[흥미로운 음악]\n[어두운 효과음]","en":"[Interesting music]\n[Dark sound effect]","start":2934.22,"end":2935.76,"viStart":2934.22,"viEnd":2935.76,"koStart":2934.22,"koEnd":2935.76,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":149,"sourceUid":"merged-mv9n4x6x-119","sourceNo":149,"originalSourceNo":822,"displayNo":149,"vi":"Quản lý Kwon. Anh cần làm gấp việc gì sao? \nRa chỗ khác. Đừng có lại gần tôi.\nĐó giờ cô đã làm được gì chưa?\nTôi toàn tự lo việc lớn.\nSao tự dưng anh nặng lời vậy?\nDạo này các cô cậu ra vẻ dữ lắm mà.\nTưởng được Go A In che chắn nên nghĩ mình to tát chứ gì?\nAnh nói gì vậy? \nCô sẽ sớm biết thôi. Rằng các cô đã chọn sai phe rồi.","ko":"배원희: CD님. 뭐 급한 일 들어왔어요? \n권우철: 가. 내 근처에 얼씬도 하지 마.\n권우철: 언제는 니들이 뭐 했냐?\n권우철: 중요한 일은 내가 다 했지\n배원희: 뭘 또 말을 그렇게…\n권우철: 아주아주 요새 기고만장했지?\n권우철: 고아인한테 딱 붙어 있으니까 뭐라도 된 거 같지?\n배원희: 제가 무슨… \n권우철: 곧 알게 된다. 니들이 잡은 줄이 썩은 동아줄이라는 거를","en":"Mr. Kwon. Is there urgent work? Get lost. Don't come near me.\nWhen did you ever do anything?\nI did all the important work.\nWhat's with the harsh words?\nYou guys have been too proud lately.\nYou think you're a big shot with Go A-in supporting you?\nWhat do you mean? \nYou'll realize soon. That you sided with the wrong person.","start":2937.464934,"end":2960.159101,"viStart":2902.718427,"viEnd":2926.49202,"koStart":2937.464934,"koEnd":2960.159101,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2902.718427,"end":2926.49202},"koRange":{"start":2937.464934,"end":2960.159101}},{"id":151,"sourceUid":"ko-muwto5lq-1788","sourceNo":151,"originalSourceNo":827,"displayNo":151,"vi":"[Âm thanh thao tác bàn phím]","ko":"[키보드 조작음]","en":"[Keyboard operation sound]","start":2990.69,"end":2992.4,"viStart":2990.69,"viEnd":2992.4,"koStart":2990.69,"koEnd":2992.4,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":152,"sourceUid":"merged-mv9nhx9v-127","sourceNo":152,"originalSourceNo":841,"displayNo":152,"vi":"Lẽ ra hôm qua chị cũng nên nhẹ nhàng như vậy.\nVì bình thường tôi hơi rụt rè.\nVà cũng hơi khó tính.\nTôi thấy chị siêu khó tính mà.\nMới chừng đó mà cô đã ngạc nhiên thì không ổn rồi.\nTừ nay, tôi sẽ khiến cô ngạc nhiên thường xuyên hơn.\nTheo hướng tích cực.\nTôi sẽ trông đợi.\nCô cũng hãy khiến tôi ngạc nhiên đi.\nBằng cách nào? Giao kèo lần này đôi bên cùng có lợi, nên thôi bỏ qua.\nSau này khi tôi cho đi một,\ntôi cũng muốn nhận lại một.\nVậy tôi xin phép đi trước.","ko":"강한나: 어제부터 이러시지 부드럽게\n고아인: 제가 낯을 좀 가려서요\n고아인: 성격도 좀 모났고\n강한나: 많이 모나신 것 같던데?\n고아인: 겨우 그 정도로 놀라시면 곤란하죠\n고아인: 앞으로는 자주 놀라게 해 드릴게요\n고아인: 긍정적인 부분에서\n강한나: 기대할게요\n고아인: 상무님도 저 좀 놀라게 해 주시고요\n강한나: 뭘요?\n고아인: 이번 일은 윈윈이니까 그렇다고 쳐도\n고아인: 앞으로 가는 게 있으면 오는 것도 있어야죠.\n고아인: 그럼 저도 바빠서","en":"You should've acted this way yesterday.\nI'm the shy type.\nAnd quite difficult.\nYou seem very difficult.\nYou can't be surprised by something like that.\nFrom now on, I'll make sure to surprise you often.\nIn a positive way.\nI look forward to it.\nYou should also surprise me too.\nHow? This deal is a win-win for both of us, so it's fine.\nBut when I give something,\nI would like something in return.\nPlease excuse me then.","start":2972.04,"end":3014.112064,"viStart":2937.214906,"viEnd":2980.260115,"koStart":2972.04,"koEnd":3014.112064,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2937.214906,"end":2980.260115},"koRange":{"start":2972.04,"end":3014.112064}},{"id":153,"sourceUid":"ko-muwto5lq-1801","sourceNo":153,"originalSourceNo":840,"displayNo":153,"vi":"[âm nhạc hồi hộp]","ko":"[긴장되는 음악]","en":"[nervous music]","start":3030.11,"end":3032.44,"viStart":3030.11,"viEnd":3032.44,"koStart":3030.11,"koEnd":3032.44,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":154,"sourceUid":"merged-mv9nuv9h-131","sourceNo":154,"originalSourceNo":849,"displayNo":154,"vi":"Phải rồi. Tôi quên không nhắc chuyện này.\nHãy chỉn chu mọi thứ, từ trang điểm cho đến trang phục.\nCô không chỉ là giám đốc.\nCô còn là người mẫu của công ty.\nCô hiểu ý tôi chứ?\nChuyện đó thì chị khỏi lo.","ko":"고아인: 아. 제가 깜빡했는데요\n강용호: 화장 하나, 옷 한 벌도 신경 써서 입으세요\n강용호: 그냥 상무가 아니라 회사 모델이 된 것처럼\n고아인: 알겠죠?\n강한나: 그건 걱정 마세요","en":"Right. I forgot to mention this.\nEverything from your makeup to your clothes should be your best.\nYou're not just a managing director.\nYou're the face of the company.\nDo you understand?\nDon't worry about that.","start":3020.501828,"end":3052.629538,"viStart":2985.607889,"viEnd":3018.797912,"koStart":3020.501828,"koEnd":3052.629538,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2985.607889,"end":3018.797912},"koRange":{"start":3020.501828,"end":3052.629538}},{"id":155,"sourceUid":"merged-mv9mzflm-113","sourceNo":155,"originalSourceNo":852,"displayNo":155,"vi":"[Âm thanh thao tác của điện thoại di động]\n[Âm báo kết nối cuộc gọi]\n[ngậm một giai điệu]","ko":"[휴대전화 조작음]\n[통화 연결음]\n[콧노래를 부른다]","en":"[Mobile phone operation sound]\n[Call connection tone]\n[hums a song]","start":3088.54,"end":3090.71,"viStart":3088.54,"viEnd":3090.71,"koStart":3088.54,"koEnd":3090.71,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":156,"sourceUid":"merged-mv9o509s-133","sourceNo":156,"originalSourceNo":854,"displayNo":156,"vi":"Tôi phải dùng máy nào để in áp phích?\nAnh dùng máy thứ hai đi.","ko":"권우철: 포스터로 뽑으려면은 어느 프린터로 연결해야 돼?\n배원희: 두 번째 프린터로 연결하시면 돼요","en":"Which printer do I use to print out a poster?\nUse the second one.","start":3069.535202,"end":3075.474532,"viStart":3036.033569,"viEnd":3040.982317,"koStart":3069.535202,"koEnd":3075.474532,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3036.033569,"end":3040.982317},"koRange":{"start":3069.535202,"end":3075.474532}},{"id":157,"sourceUid":"merged-mv9n0293-116","sourceNo":157,"originalSourceNo":859,"displayNo":157,"vi":"[ngậm một bài hát]\n[âm thanh rung của điện thoại di động]\n[Tiếng gõ cửa]\n[Tiếng đóng cửa]","ko":"[콧노래를 부른다]\n[휴대전화 진동음]\n[노크 소리]\n[문 닫히는 소리]","en":"[hums a song]\n[cell phone vibrating sound]\n[Knocking sound]\n[Sound of door closing]","start":3124.53,"end":3125.41,"viStart":3124.53,"viEnd":3125.41,"koStart":3124.53,"koEnd":3125.41,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":158,"sourceUid":"merged-mv9oc7b1-145","sourceNo":158,"originalSourceNo":873,"displayNo":158,"vi":"Vào đi. Chị gọi tôi ạ, Giám đốc Go?\nChị cần tôi làm gì cho chị sao? Phải.\nChuyên viên Bae. Vâng.\nSao cô lại ăn mặc như vậy? Sao ạ?\nChuyên viên Bae thì sao?\nCô ấy lên ý tưởng chủ đạo giỏi lắm.\nCô ấy là người viết đề án giỏi nhất ngành luôn đó.\nĐó là hai đầu việc quan trọng nhất của một quản lý sáng tạo.\nNhưng cô ấy vẫn chưa được lên chức quản lý sáng tạo?\nNhưng quản lý sáng tạo vẫn còn một nhiệm vụ quan trọng nữa.\nHọp với khách hàng.","ko":"고아인, 배원희: 들어와. 상무님, 부르셨어요?\n배원희: 뭐 시키실 일이라도… 응\n고아인: 원희 카피. 네?\n고아인: 옷을 왜 그렇게 입고 다니지?\n고아인: 원희 카피는 어때?\n한병수: 아유, 원희 카피 컨셉 잘 잡죠\n한병수: 기획서는, 뭐 업계에서 제일 잘 쓰고\n권우철: CD 롤이 컨셉 잘 잡고 기획서 쓰는 건데\n고아인: 그거 제일 잘하는 애가 아직까지 CD를 못 달았다?\n한병수: 근데 CD가 하는 가장 중요한 업무\n한병수: 하나 더 있잖아요","en":"Come in. Did you call for me, Ms. Go?\nDo you need something from me?\nYes. Ms. Bae. Yes, ma'am.\nWhy do you dress like that?\nI'm sorry? What about Ms. Bae?\nShe comes up with great concepts.\nAnd she writes the best proposals in the field.\nThose are the two most important jobs of a creative director.\nBut she's still not a creative director?\nYou forgot another most important job of a creative director. Client meetings.","start":3095.964431,"end":3143.803342,"viStart":3113.02,"viEnd":3113.02042,"koStart":3095.964431,"koEnd":3143.803342,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3113.02,"end":3113.02042},"koRange":{"start":3095.964431,"end":3143.803342}},{"id":159,"sourceUid":"ko-muwto5lq-1835","sourceNo":159,"originalSourceNo":874,"displayNo":159,"vi":"[Âm nhạc ý nghĩa]","ko":"[의미심장한 음악]","en":"[Meaningful music]","start":3167.12,"end":3168.03,"viStart":3167.12,"viEnd":3168.03,"koStart":3167.12,"koEnd":3168.03,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":160,"sourceUid":"merged-mvabz1lz-153","sourceNo":160,"originalSourceNo":882,"displayNo":160,"vi":"Chắc cô cũng hiểu rõ lý do mà. Tôi hiểu chứ.\nĐám khách không biết đánh giá quảng cáo.\nMới nhìn bề ngoài đã khen đối phương tinh tế, biết nắm bắt xu hướng.\nRồi xem đó như năng lực làm việc.\nTôi mặc vậy để làm việc cho thoải mái.\nTôi cũng hơi lười ăn mặc chải chuốt.\nSao cô lại muốn chống lại thế giới? Sao ạ?","ko":"한병수: 광고주 미팅\n한병수: 이유는 상무님이 잘 아시잖아요. 알지\n고아인: 광고 보는 눈 없는 광고주들\n고아인: 겉모습만 보고 센스 있네, 트렌디하네 하면서\n고아인: 업무 능력 평가해 버리니까\n배원희: 일하기 편하기도 하고\n배원희: 차려입기 귀찮기도 하고\n고아인: 왜 세상이랑 싸우는 거야? 네?","en":"And you know why she's weak at that. I do.\nIgnorant clients judge you by your appearance.\nThey think, \"They look trendy enough.\"\nAnd that becomes your performance.\nIt's comfortable to work in these.\nAnd I'm too lazy to dress up nicely.\nWhy do you fight against the world? Sorry?","start":3143.803342,"end":3174.960751,"viStart":3113.02042,"viEnd":3140.427132,"koStart":3143.803342,"koEnd":3174.960751,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3113.02042,"end":3140.427132},"koRange":{"start":3143.803342,"end":3174.960751}},{"id":161,"sourceUid":"merged-mvac0v3y-159","sourceNo":161,"originalSourceNo":896,"displayNo":161,"vi":"Cô nhiều kinh nghiệm như vậy, chắc cũng thừa hiểu\nngành này coi trọng ngoại hình không kém gì năng lực.\nCô đã thấy phát thanh viên mặc đồ ngủ dẫn tin chưa?\nNếu khách hàng mong đợi chúng ta có diện mạo chuẩn chỉnh,\nđó cũng là một phần việc mà cô phải làm.\nNghĩa là… Tức là tôi… Vậy nếu tôi trang điểm và chú ý trang phục hơn…\nTôi có cho cô lên chức không à?","ko":"고아인: 형식이 본질보다 중요할 때도 많다는 거\n고아인: 원희 카피 연차쯤 되면 충분히 알 거 같은데\n고아인: 파자마 입고 뉴스 진행하는 앵커 봤어?\n고아인: 광고주가 대행사 직원에게 요구하는 이미지가 있으면\n고아인: 그 이미지를 보여 주는 것도 일종의 업무 아닌가?\n배원희: 아… 그러니까. 그게, 저는… 그럼 제가 화장도 하고\n고아인: 옷도 신경 써서 입으면 CD 시켜 줄 거냐고?","en":"With your level of experience, I'm sure you know\nthat looks are as important as the essence of our work.\nHave you seen a newscaster read the news in pajamas?\nIf there's a certain image that the clients want from us,\nit's our job to reflect that image.\nThen… Then I… Then if I wear makeup and dress up nicely…\nWill I make you a creative director?","start":3174.960751,"end":3223.602273,"viStart":3139.489626,"viEnd":3190.269285,"koStart":3174.960751,"koEnd":3223.602273,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3139.489626,"end":3190.269285},"koRange":{"start":3174.960751,"end":3223.602273}},{"id":162,"sourceUid":"ko-muwto5lq-1851","sourceNo":162,"originalSourceNo":890,"displayNo":162,"vi":"[âm nhạc đen tối]","ko":"[어두운 음악]","en":"[dark music]","start":3214,"end":3215.87,"viStart":3214,"viEnd":3215.87,"koStart":3214,"koEnd":3215.87,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":163,"sourceUid":"merged-mvar7soz-167","sourceNo":163,"originalSourceNo":847,"displayNo":163,"vi":"Không cần trả lời đâu. Sao ạ?\nCô sẽ được thăng chức làm quản lý sáng tạo. Công ty quảng cáo chứ đâu phải công ty người mẫu.\nCứ làm những việc cô giỏi nhất đi. Còn lại để tôi lo.\nCảm ơn chị. Cảm ơn chị rất nhiều, Giám đốc Go. Tôi sẽ làm thật tốt. Tôi sẽ cố gắng… Không, tôi sẽ làm thật tốt.\nĐược rồi. Tôi rất mong đợi vào cô. Nhưng mà… tôi còn một việc nữa cần cô làm.\nViệc gì vậy ạ?\nQuản lý Kwon. Cô phải giữ anh ta ở lại đội.","ko":"고아인: 됐어, 대답 안 해도 돼. 네? \n고아인: 네? 대행사가 무슨 모델 에이전시도 아니고\n고아인: 넌 네가 잘하는 일만 해 나머진 내가 할 테니까\n배원희: 배원희: 감사합니다. 감사합니다, 상무님. 저 진짜 잘할게요. 저 진짜 열심히, 아니야. 저 잘할게요\n고아인: 그래, 기대가 크다. 근데 원희 카피가 해야 할 일이. 하나 더 있어\n배원희: 아, 무, 무슨…\n권우철: 권 CD. 네가 팀원으로 데리고 있어야 돼","en":"No need to answer that. Sorry?\nYou'll be promoted to creative director. An advertisement agency isn't a modeling agency.\nJust do what you are good at. I'll do the rest.\nThank you. Thank you so much, Ms. Go. I'll do well. I'll try my… No, I'll do my best.\nSure. I look forward to your work.\nBut… there's another job you have to take on.\nWhat is it?\nDirector Kwon. He needs to stay on your team.","start":3223.602273,"end":3275.402917,"viStart":3190.269285,"viEnd":3241.541847,"koStart":3223.602273,"koEnd":3275.402917,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3190.269285,"end":3241.541847},"koRange":{"start":3223.602273,"end":3275.402917}},{"id":164,"sourceUid":"merged-mvar6j4b-165","sourceNo":164,"originalSourceNo":905,"displayNo":164,"vi":"[Âm nhạc êm dịu]\n[thở run rẩy]\n[Tiếng khóc]","ko":"[잔잔한 음악]\n[떨리는 숨소리]\n[울먹이는 소리]","en":"[Calm music]\n[shaking breathing]\n[Crying sound]","start":3271.81,"end":3273.1,"viStart":3271.81,"viEnd":3273.1,"koStart":3271.81,"koEnd":3273.1,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":165,"sourceUid":"merged-mvaslnw0-9","sourceNo":165,"originalSourceNo":922,"displayNo":165,"vi":"Không sao. Khi chuyện tốt xảy ra, ắt sẽ có chuyện xấu đi kèm.\nNghĩ tích cực lên nào.\nAnh đang làm gì vậy?\nNày, băng dính đâu nhỉ?\nAnh định dán vào phòng họp sao?\nKhông, dưới sảnh. Mà thôi. Để tôi tự tìm.","ko":"배원희: 그래, 좋은 일 하나 생기면\n배원희: 나쁜 일 하나 생기는 거야. 당연하지 좋게 생각하자\n배원희, 권우철: 뭐 하세요? 야, 테이프 어디 있지?\n배원희: 회의실에 붙이시게요?\n권우철: 아니, 로비에. 아니야, 아니야. 내가 찾을게","en":"All right. When there's good news, there's always bad news.\nLet's think positively.\nWhat are you doing?\nHey, where's the tape? Are those for the meeting room?\nNo, the lobby. Never mind. I'll find it.","start":3286.816885,"end":3328.781461,"viStart":3252.061847,"viEnd":3294.400532,"koStart":3286.816885,"koEnd":3328.781461,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3252.061847,"end":3294.400532},"koRange":{"start":3286.816885,"end":3328.781461}},{"id":166,"sourceUid":"merged-mvasn5zo-16","sourceNo":166,"originalSourceNo":929,"displayNo":166,"vi":"[Âm thanh vận hành máy in]\n[Âm nhạc ý nghĩa]\n[cười]\n[cười]","ko":"[프린터 작동음]\n[의미심장한 음악]\n[헛웃음]\n[피식 웃는다]","en":"[Printer operating sound]\n[Meaningful music]\n[laughter]\n[laughter]","start":3398.64,"end":3399.56,"viStart":3398.64,"viEnd":3399.56,"koStart":3398.64,"koEnd":3399.56,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":167,"sourceUid":"merged-mvasn1td-15","sourceNo":167,"originalSourceNo":928,"displayNo":167,"vi":"PHÒNG IN\nCái gì thế này?\nChắc sẽ rất khó để hòa hợp với anh ta.\nKHÔNG PHẢI AI CŨNG CÓ THỂ LÀM LÃNH ĐẠO\nQuản lý Kwon đang định dán thứ này dưới sảnh công ty.\nThật là đáng cảm kích. Anh ta lại làm to chuyện hơn rồi.","ko":"배원희: 좋게 지내긴 어렵겠다\n배원희: 권 CD님이 이거 회사 로비에 붙인다고 하시던데요\n고아인: 고맙게도 판을 더 키워 주시네?","en":"What are these?\nIt'll be hard to get along with him.\nNOT EVERYONE CAN BE AN EXECUTIVE\nMr. Kwon is putting these up in the company lobby.\nWhat a pleasant surprise. He's making things bigger.","start":3358.601228,"end":3375.31379,"viStart":3324.060585,"viEnd":3341.980585,"koStart":3358.601228,"koEnd":3375.31379,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3324.060585,"end":3341.980585},"koRange":{"start":3358.601228,"end":3375.31379}},{"id":168,"sourceUid":"merged-mvasoiwf-18","sourceNo":168,"originalSourceNo":934,"displayNo":168,"vi":"[Âm nhạc thú vị]\n[Âm nhạc sôi động]\n[Phóng viên tiếp tục đưa ra yêu cầu]\n[Hiệu ứng âm thanh màn trập máy ảnh]\n[Phóng viên 3 cười]","ko":"[흥미로운 음악]\n[흥미진진한 음악]\n[기자들이 연신 요청한다]\n[카메라 셔터 효과음]\n[기자3이 웃으며]","en":"[Interesting music]\n[Exciting music]\n[Reporters keep making requests]\n[Camera shutter sound effect]\n[Reporter 3 laughing]","start":3375.31379,"end":3401.9732,"viStart":3375.31379,"viEnd":3401.9732,"koStart":3375.31379,"koEnd":3401.9732,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":3375.31379,"end":3401.9732}},{"id":169,"sourceUid":"merged-mvat76ic-26","sourceNo":169,"originalSourceNo":939,"displayNo":169,"vi":"Xin hãy nhìn vào đây. Nhìn bên này nữa ạ. Đẹp lắm.\nCô nhìn vào ống kính đi. Rất đẹp.\nNghe nói vừa đi làm, cô đã rất mạnh mẽ mang làn gió mới đến cho công ty.\nKhi nghe tin con gái chủ tịch đi làm, hẳn ai cũng nghĩ, \"Cô ta đi cửa sau, ăn không ngồi rồi.\nCon gái nhà tài phiệt sao phải đi làm?\"\nHọ nói như vậy đấy. Vâng, cũng phải.","ko":"여기 한번 봐 주세요. 오른쪽 한 번만 봐 주세요\n인터뷰어: 출근 첫날부터 개혁 드라이브를 강하게 거셨다고 들었습니다\n인터뷰어: 회장 딸 출근한다고 하면 다들\n인터뷰어: '낙하산이다', '날로 먹는다'\n인터뷰어: '재벌 딸이 회사 와서 뭐 할 게 있냐'\n인터뷰어, 강한나: 그렇게 말하잖아요? 뭐, 그렇죠","en":"Please look here. Please look this way as well. This is great.\nPlease look into this camera. Great.\nI heard you went strong on your first day to bring about change.\nWhen the chairman's daughter goes to work,\npeople immediately think, \"She's a nepotism baby.\"\n\"What's the point of a rich girl coming to work?\"\nThat's what everyone says. Well, I guess.","start":3404.88286,"end":3421.320403,"viStart":3370.060676,"viEnd":3386.02119,"koStart":3404.88286,"koEnd":3421.320403,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3370.060676,"end":3386.02119},"koRange":{"start":3404.88286,"end":3421.320403}},{"id":170,"sourceUid":"merged-mvat9ua6-30","sourceNo":170,"originalSourceNo":952,"displayNo":170,"vi":"Vậy nên tôi mới làm việc. Ý cô là sao?\nXử lý những tập quán cổ hủ và sai trái mà không ai dẹp bỏ được.\nNếu chỉ làm những việc ai cũng làm được, vậy sao họ lại cần tôi đây?\nNghe hay đó.\nCô có vai trò riêng biệt với tư cách là tài phiệt đời thứ ba?\nCó sức mạnh thì phải biết tận dụng, đúng nơi đúng chỗ.\nQuảng bá bản thân bằng cách diễn kịch ngồi ăn trưa cùng nhân viên?\nQuá là nhàm chán.","ko":"강한나: 이런 일 해야죠\n인터뷰어: 이런 일이라면…\n강한나: 아무도 손 못 대는 구습, 악습 해결하는 거\n강한나: 남들이 다 할 수 있는 일 할 거면 제가 왜 필요하겠어요?\n인터뷰어: 어유, 좋은데요?\n인터뷰어: 재벌 3세라서 할 수 있는 일은 따로 있다?\n강한나: 힘이 있으면 써야죠 제대로 된 곳에\n강한나: 어쭙잖게 직원 식당에서\n강한나: 같이 밥이나 먹는 사진으로 홍보하는 거\n강한나: 구식이잖아요?","en":"But this is why I work. What do you mean?\nI get rid of old and corrupt practices no one else can get rid of.\nIf I'm here to do what others can do, why would they need me?\nThat's great.\nSo there's a role you can play as the third-generation chaebol.\nYou should use power if you have it, but properly.\nPutting on a show by eating lunch with employees at the cafeteria.\nThat's just lame.","start":3421.320403,"end":3448.783815,"viStart":3386.02119,"viEnd":3417.770333,"koStart":3421.320403,"koEnd":3448.783815,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3386.02119,"end":3417.770333},"koRange":{"start":3421.320403,"end":3448.783815}},{"id":171,"sourceUid":"merged-mvatalyv-34","sourceNo":171,"originalSourceNo":956,"displayNo":171,"vi":"[Phóng viên cười]\n[Cùng nhau cười]\n[Youngwoo nói nhẹ nhàng]\n[Hết cơn ho]\n[âm thanh rung của điện thoại di động]\n[Phóng viên 4 cười] Vâng","ko":"[기자들의 웃음]\n[함께 웃는다]\n[영우가 작게]\n[헛기침]\n[휴대전화 진동음]\n[기자4가 웃으며] 네","en":"[Reporters laughing]\n[Laugh together]\n[Youngwoo speaks softly]\n[Clears cough]\n[cell phone vibrating sound]\n[Reporter 4 laughing] Yes","start":3486.52,"end":3488.35,"viStart":3486.52,"viEnd":3488.35,"koStart":3486.52,"koEnd":3488.35,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":172,"sourceUid":"merged-mvatca7c-42","sourceNo":172,"originalSourceNo":968,"displayNo":172,"vi":"Tháng trước, chủ tịch cũng mới ăn trưa với nhân viên ở nhà ăn ạ.\nTôi xin phép rút lại câu vừa nãy.\nĐược. Vâng, Giám đốc Go.\nCuộc phỏng vấn ra sao rồi?\nSắp kết thúc rồi.\nTôi gọi để đề phòng thôi, phiền anh để mắt đến các phóng viên.\nHọ viết bài quảng bá cho mình mà.\nĐược, tôi sẽ làm vậy.\nVới lại, khi các phóng viên ra về, sẽ rất hay nếu Giám đốc Kang có thể đích thân ra tiễn.\nPhải làm tới mức đó sao?\nNếu các phóng viên được con gái chủ tịch tiễn mình ra tận cửa, chắc chắn họ sẽ thể hiện lòng biết ơn trên bài báo.\nCô nói đúng. Tôi sẽ nói cô ấy làm vậy. Cảm ơn anh.","ko":"박영우: 회장님 저번 달에 직원 식당에서 식사하셨습니다\n강한나: 방금 한 말은 취소할게요\n박영우, 고아인: 네, 상무님. 지금 인터뷰 중이시죠?\n박영우, 고아인: 거의 끝나 갑니다. 혹시나 해서 드리는 말씀인데 기자분들 신경 좀 써 주세요\n고아인: 우리 쪽 홍보 기사 내는 거니까\n박영우: 네, 그러고 있습니다\n고아인: 그리고 기자분들이 가실 때 배웅해 드리면 좋을 거 같은데\n고아인, 박영우: 한나 상무님이 직접. 그렇게까지 해야 할까요?\n고아인: 회장 따님이 로비까지 직접 배웅을 해 주면\n고아인: 그 황송함이 기사에 묻어나지 않겠어요?\n박영우: 그렇네요, 말씀대로 하겠습니다. 수고하세요","en":"The chairman had lunch with employees at the cafeteria last month.\nScratch what I just said.\nAll right. Yes, Ms. Go.\nHow's the interview going?\nWe're almost done.\nI'm saying this just in case, but please take good care of the reporters.\nThey're writing our article. Yes, of course.\nAlso, when the reporters are leaving, it'd be nice if Ms. Kang\ncould show them out herself.\nDo we have to go that far?\nIf the chairman's daughter shows them out herself,\ntheir gratitude will show in their articles.\nYou're right. I'll make sure she does that. Thank you.","start":3453.886854,"end":3502.401268,"viStart":3417.770333,"viEnd":3468.412699,"koStart":3453.886854,"koEnd":3502.401268,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3417.770333,"end":3468.412699},"koRange":{"start":3453.886854,"end":3502.401268}},{"id":173,"sourceUid":"merged-mvatcel4-43","sourceNo":173,"originalSourceNo":969,"displayNo":173,"vi":"[âm nhạc đen tối]\n[Âm thanh thao tác của điện thoại di động]\n[Cười]","ko":"[어두운 음악]\n[휴대전화 조작음]\n[픽 웃는다]","en":"[dark music]\n[Mobile phone operation sound]\n[Laughs]","start":3526.6,"end":3528.39,"viStart":3526.6,"viEnd":3528.39,"koStart":3526.6,"koEnd":3528.39,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":174,"sourceUid":"merged-mvawxy4v-55","sourceNo":174,"originalSourceNo":983,"displayNo":174,"vi":"Trong lúc Giám đốc Choi đang cố đánh bại tôi,\nGiám đốc Choi lại gây chiến với một người không nên đối đầu.\nMọi người vất vả nhiều rồi.\nCảm ơn. Cảm ơn. Cảm ơn. Chà.\nLoại bỏ mọi yêu cầu bất hợp lý từ khách hàng. Nghe thực sự rất thỏa mãn.\nCô đích thân ra tiễn họ đi.\nTôi biết rồi. Để tôi tiễn mọi người. Ôi trời.\nHân hạnh quá. Cảm ơn cô. Chúng ta đi nhé?","ko":"고아인: 우리 최 상무님 나랑 싸우려다\n고아인: 진짜 역린을 건드리게 생기셨네\n강한나: 다들 수고들 많으셨습니다\n인터뷰어: 수고하셨습니다\n인터뷰어: 이야 '광고주의 부당한 업무 지시 철폐' 진짜 속 시원했습니다\n박영우, 강한나: 기자분들 배웅하시죠. 알았어\n강한나, 인터뷰어: 제가 배웅하겠습니다. 어머, 영광입니다. 감사합니다. 가시죠","en":"In an attempt to beat me, Mr. Choi ended up picking a fight with someone he shouldn't.\nThank you, everyone. Thank you. Thank you. Thank you. Gosh.\nGetting rid of all the inappropriate requests from clients.\nThat was so satisfying. You should show them out.\nSure. I'll show you out. Oh, my. What an honor. Thank you. Shall we?","start":3507.039314,"end":3543.28276,"viStart":3473.142223,"viEnd":3509.112843,"koStart":3507.039314,"koEnd":3543.28276,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3473.142223,"end":3509.112843},"koRange":{"start":3507.039314,"end":3543.28276}},{"id":175,"sourceUid":"merged-mvawy0ly-56","sourceNo":175,"originalSourceNo":984,"displayNo":175,"vi":"[Cùng nhau cười][Nhỏ]\n[Âm nhạc ý nghĩa]","ko":"[함께 웃는다][작게]\n[의미심장한 음악]","en":"[Laugh together][Small]\n[Meaningful music]","start":3565.27,"end":3567.85,"viStart":3565.27,"viEnd":3567.85,"koStart":3565.27,"koEnd":3567.85,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":176,"sourceUid":"merged-mvaxb1oc-73","sourceNo":176,"originalSourceNo":999,"displayNo":176,"vi":"Sắp đến giờ họ xuất hiện rồi. CÔNG TY TRUYỀN THÔNG VC\nÔi trời. Hình như chúng ta gặp nhau hơi thường xuyên.\nBọn họ làm gì vậy chứ? Chúng ta đang bận bù đầu.\nĐổi công ty quảng cáo khác đi.\nChúng ta là công ty con, nên không đổi được, biết làm sao đây?\nPhải cho họ một bài học rồi dẫn dắt thôi. Chúng ta đi nào. Xin mời.\nCảm ơn cô vì buổi phỏng vấn.\nTôi cũng đã rất vui. Cô giỏi ăn nói quá.\nTRUYỀN THÔNG VC\nTôi sẽ viết một bài thật hay.","ko":"최창수: 슬슬 오실 때가 됐는데 \"VC기획\"\n본사상무: 아유, 아유. 어제도 보고 오늘도 보고 너무 자주들 보네?\n본사상무: 아, 이게 뭐 하는 짓입니까. 바빠 죽겠는데\n본사상무: 아, 대행사 바꾸면. 그만인데 계열사라고 바꿀 수도 없고 어쩝니까?\n본사상무: 매질들 하면서 데리고 가야지. 갑시다. 들어가시죠\n인터뷰어: 아, 오늘 인터뷰 너무 감사합니다\n인터뷰어: 저도 너무 좋았어요. 아주 그냥 말발이…\n인터뷰어: 기사 잘 써 드릴게요, 진짜","en":"It's about time they arrive. Goodness. \nIt seems like we see each other too often.\nThis is keeping us from doing our actual work.\nLet's just change agencies.\nWe have no choice as subsidiaries, except for one.\nWe must teach and lead them. Let's go in. Please. \nThank you for the interview.\nI had a lot of fun too. You're an eloquent…\nI'll write up a great article.","start":3552.521218,"end":3601.77235,"viStart":3517.930431,"viEnd":3566.994405,"koStart":3552.521218,"koEnd":3601.77235,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3517.930431,"end":3566.994405},"koRange":{"start":3552.521218,"end":3601.77235}},{"id":177,"sourceUid":"merged-mvaxapu0-72","sourceNo":177,"originalSourceNo":998,"displayNo":177,"vi":"[âm nhạc hồi hộp]\n[Cùng nhau cười]","ko":"[긴장되는 음악]\n[함께 웃는다]","en":"[nervous music]\n[Laugh together]","start":3620.78,"end":3622.2,"viStart":3620.78,"viEnd":3622.2,"koStart":3620.78,"koEnd":3622.2,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":178,"sourceUid":"merged-mvaxusgg-75","sourceNo":178,"originalSourceNo":1001,"displayNo":178,"vi":"Ôi trời, công chúa bé bỏng, thật là đáng thương.","ko":"고아인: 아이고. 우리 공주님 불쌍해서 어쩌나","en":"Gosh, I feel so bad for our princess.","start":3601.77235,"end":3608.842934,"viStart":3566.994405,"viEnd":3575.365199,"koStart":3601.77235,"koEnd":3608.842934,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3566.994405,"end":3575.365199},"koRange":{"start":3601.77235,"end":3608.842934}},{"id":179,"sourceUid":"merged-mvaxbox6-74","sourceNo":179,"originalSourceNo":1003,"displayNo":179,"vi":"[âm nhạc hồi hộp]\n[âm nhạc đen tối]","ko":"[긴장되는 음악]\n[어두운 음악]","en":"[nervous music]\n[dark music]","start":3671.41,"end":3673.71,"viStart":3671.41,"viEnd":3673.71,"koStart":3671.41,"koEnd":3673.71,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":181,"sourceUid":"ko-muwto5lq-1965","sourceNo":181,"originalSourceNo":1004,"displayNo":181,"vi":"[thở run rẩy]","ko":"[떨리는 숨소리]","en":"[shaking breathing]","start":3688.01,"end":3689.1,"viStart":3688.01,"viEnd":3689.1,"koStart":3688.01,"koEnd":3689.1,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":182,"sourceUid":"merged-mvaxyrfn-82","sourceNo":182,"originalSourceNo":1007,"displayNo":182,"vi":"Đám người này… \nNào. Bộc lộ tính nóng nảy của cô đi.","ko":"강한나: 이것들이… \n고아인: 자. 승질 한번 부려 보시죠","en":"Those little… \nCome on. Show me your worst.","start":3670.592172,"end":3679.318145,"viStart":3636.025803,"viEnd":3645.583717,"koStart":3670.592172,"koEnd":3679.318145,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3636.025803,"end":3645.583717},"koRange":{"start":3670.592172,"end":3679.318145}},{"id":184,"sourceUid":"merged-mvay0qog-85","sourceNo":184,"originalSourceNo":1009,"displayNo":184,"vi":"[Tiếng bước chân]\n[Âm nhạc cảm xúc]","ko":"[발걸음이 울린다]\n[감성적인 음악]","en":"[Footsteps sound]\n[Emotional music]","start":3707.046811,"end":3733.440256,"viStart":3672.624418,"viEnd":3698.990495,"koStart":3707.046811,"koEnd":3733.440256,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3672.624418,"end":3698.990495},"koRange":{"start":3707.046811,"end":3733.440256}},{"id":185,"sourceUid":"merged-mvay31q0-93","sourceNo":185,"originalSourceNo":949,"displayNo":185,"vi":"Ai đã sai anh dán những thứ này lên?\nSao lại gây sự với con gái chủ tịch thế?\nCô thật là… Lẽ nào, anh bắt chước tôi?\nChoi Chang Su và Go A In.\nHai giám đốc thấp hèn đó đều muốn cảm nắng tôi.\nVậy cô muốn kiểm tra họ sao?","ko":"강한나, 고아인: 이거 시킨 사람 누구냐고! 왜 회장 딸에게 싸움을 걸고 그러세요?\n고아인: 진짜… 혹시 나 따라 하는 거예요?\n강한나: 최창수, 고아인 요 상무 나부랭이들이 나랑 썸을 타자고 하니까\n박영우: 테스트를 해 보신다는 거예요?","en":"Who told you to put these up?\nWhy would you pick a fight with the chairman's daughter?\nSeriously… By any chance,\nwere you copying me?\nChoi Chang-su and Go A-in.\nThese lowly managing directors both want me.\nSo you want to test them?","start":3733.440256,"end":3751.687352,"viStart":3698.990495,"viEnd":3712.940408,"koStart":3733.440256,"koEnd":3751.687352,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3698.990495,"end":3712.940408},"koRange":{"start":3733.440256,"end":3751.687352}},{"id":186,"sourceUid":"merged-mvb2lyqe-99","sourceNo":186,"originalSourceNo":1022,"displayNo":186,"vi":"Gói thầu trị giá 30 tỷ won. Các vị có một tuần.\nĐây chính là loại quảng cáo kiểu gì cũng không thực hiện.\nTrước sau vẫn như một thôi.\nPhe thắng chính là phe mình.","ko":"빌링은 300억 일주일 드리겠습니다\n조은정: 이거 그거네 어차피 안 할 광고\n강한나: 우리는 언제나 똑같아\n강한나: 이기는 편. 우리 편","en":"The billing is 30 billion won. You have one week.\nThis is an advertisement they'll never follow through.\nWe always play by the same rule.\nThe winner is on my team.","start":3751.687352,"end":3763.283996,"viStart":3751.687352,"viEnd":3763.283996,"koStart":3751.687352,"koEnd":3763.283996,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":3751.687352,"end":3763.283996}},{"id":187,"sourceUid":"merged-mvb2m28n-100","sourceNo":187,"or
