<script>
let project = {"version":"MATCHING_GAME_PROJECT_V1","source":"Subtitle Dub VI + KO Live Cut Studio V4.9.104","title":"Agency S01E05","movieTitle":"Agency","episodeTitle":"S01E05","audioFolder":"../audio","viAudioFile":"agency_s01e05_VI_Dub.mp3","koAudioFile":"agency_s01e05_KO_Live.mp3","items":[{"id":1,"sourceUid":"cand-muwtsql0-2944","sourceNo":1,"originalSourceNo":1,"displayNo":1,"vi":"CÔNG TY QUẢNG CÁO S01E05","ko":"대행사 S01E05","en":"AGENCY S01E05","start":64.06,"end":64.06,"viStart":64.06,"viEnd":64.06,"koStart":64.06,"koEnd":64.06,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":2,"sourceUid":"merged-muwtqs1q-2943","sourceNo":2,"originalSourceNo":6,"displayNo":2,"vi":"1 [Bài hát chủ đề]\n2 [Âm nhạc ý nghĩa]\n3 [Âm thanh báo động]\n4 [Ain cười khúc khích]\n5 [Âm thanh vận hành điều khiển từ xa của ô tô]","ko":"1 [주제곡]\n2 [의미심장한 음악]\n3 [알람 소리]\n4 [아인이 피식 웃으며]\n5 [자동차 리모컨 조작음]","en":"1 [Theme song]\n2 [Meaningful music]\n3 [Alarm sound]\n4 [Ain chuckles]\n5 [Car remote control operation sound]","start":64.06,"end":65.1,"viStart":64.06,"viEnd":65.1,"koStart":64.06,"koEnd":65.1,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":4,"sourceUid":"merged-muwtp1z9-2942","sourceNo":4,"originalSourceNo":5,"displayNo":4,"vi":"Công chúa nhỏ tham vọng\nnhưng ở công ty không có ai về phe mình.\nĐến lúc mình nên vào lễ chào mừng rồi.","ko":"고아인: 욕심은 많은데\n고아인: 그룹에 내 편 하나 없는 공주님\n고아인: 슬슬 환영해 드리러 가야겠네","en":"Our ambitious little princess\nwith no one to rely on at the company.\nI should go in for her welcoming ceremony.","start":27.24947,"end":35.590204,"viStart":27.24947,"viEnd":35.590204,"koStart":27.24947,"koEnd":35.590204,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":27.24947,"end":35.590204}},{"id":5,"sourceUid":"merged-muwu80xi-2947","sourceNo":5,"originalSourceNo":9,"displayNo":5,"vi":"Mới lần đầu gặp mà đã cúi đầu chào hỏi thì còn gì đặc biệt nữa.\nChị là giám đốc Go A In nhỉ?\nRất vui được gặp cô. Tôi là Go A In.\nGiám đốc Kang. Hôm nay là lần đầu nhỉ?","ko":"고아인: 처음부터 숙이고 들어가면\n고아인: 변별력이 있나\n강한나: 고아인 상무님이시죠?\n[헛웃음][어두운 음악]\n고아인: 반갑습니다, 고아인입니다\n고아인: 상무님, 처음이시죠?","en":"I won't look special if I cave to her from the get-go.\nYou must be Managing Director Go A-in. Nice to meet you.\nI'm Go A-in. Ms. Kang. This must be your first.","start":42.007566,"end":61.030308,"viStart":7.785075,"viEnd":26.702948,"koStart":42.007566,"koEnd":61.030308,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":7.785075,"end":26.702948},"koRange":{"start":42.007566,"end":61.030308}},{"id":6,"sourceUid":"merged-muwuf9mh-2948","sourceNo":6,"originalSourceNo":18,"displayNo":6,"vi":"Ý chị là sao? Làm ở công ty quảng cáo…\nÀ không… Lần đầu cô đi làm.\nChắc cô sẽ còn nhiều điều không biết, khi làm việc có gì thắc mắc, cô cứ hỏi nhé.\nĐừng mù mờ không biết gì,\nrồi làm những việc không ai bảo, kẻo gây rắc rối lớn đó.","ko":"강한나: 무슨? 대행사…\n고아인: 아니. 회사 생활. 모르는 거 많으실 테니까\n고아인: 앞으론 물어보면서 일하세요\n고아인: 아무것도 모르면서 시키지도 않은 일 하다가\n고아인: 사고 치지 마시고","en":"What do you mean? Working for an agency…\nNo, I mean… Working for a company.\nI'm sure you have much to learn, so you can ask\nwhenever you have questions.\nDon't cause trouble by doing something you don't even know.","start":61.030308,"end":78.961918,"viStart":26.702948,"viEnd":45.269544,"koStart":61.030308,"koEnd":78.961918,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":26.702948,"end":45.269544},"koRange":{"start":61.030308,"end":78.961918}},{"id":7,"sourceUid":"ko-muwto5lm-980","sourceNo":7,"originalSourceNo":19,"displayNo":7,"vi":"Ả điên đó… Gì vậy? Chị ấy điên rồi sao?\nChị ấy muốn bị đuổi việc sao?\nĐiên rồi à?","ko":"창수: 저 미친…\n직원1: 와, 이게 뭔 일이야\n직원2: 대박","en":"That crazy… What was that? She must be crazy.\nDoes she want to get fired?\nShe's nuts.","start":78.961918,"end":102.340645,"viStart":45.269544,"viEnd":67.357864,"koStart":78.961918,"koEnd":102.340645,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":45.269544,"end":67.357864},"koRange":{"start":78.961918,"end":102.340645}},{"id":8,"sourceUid":"merged-muwuv06x-2949","sourceNo":8,"originalSourceNo":25,"displayNo":8,"vi":"Nếu có gì thắc mắc,\ncô cứ đến văn phòng của tôi nhé.\nVậy tôi bận nên xin phép đi trước.","ko":"고아인: 앞으로 궁금한 거 있으시면 언제든지 제 방으로 오세요\n고아인: [아인] 그럼 저는 바빠서 먼저","en":"Feel free to come to my office\nif you have any questions.\nI'll get going. I have a lot to do.","start":102.340645,"end":108.525643,"viStart":67.357864,"viEnd":75.357138,"koStart":102.340645,"koEnd":108.525643,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":67.357864,"end":75.357138},"koRange":{"start":102.340645,"end":108.525643}},{"id":9,"sourceUid":"merged-muy7gpz9-3","sourceNo":9,"originalSourceNo":32,"displayNo":9,"vi":"[âm nhạc hồi hộp]\n[Nhân viên khó chịu]\n[Âm nhạc ý nghĩa]","ko":"[긴장되는 음악]\n[직원들이 술렁인다]\n[의미심장한 음악]","en":"[nervous music]\n[Employees are upset]\n[Meaningful music]","start":168.5,"end":170.33,"viStart":168.5,"viEnd":170.33,"koStart":168.5,"koEnd":170.33,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":10,"sourceUid":"merged-muy7gjb2-2","sourceNo":10,"originalSourceNo":31,"displayNo":10,"vi":"Giám đốc Go A In. Vâng?\nCHÚC MỪNG NHẬM CHỨC, GIÁM ĐỐC KANG HAN NA\nChị phải cho tôi biết văn phòng chị ở đâu đã chứ. Phải rồi.\nChắc cô cũng chẳng biết văn phòng của tôi nằm ở đâu nhỉ? \nCô hãy tự hỏi chuyện đó nhé.","ko":"강한나: 고아인 상무님? 네?\n강한나: 방 어딘지 알려 주고 가셔야죠\n고아인: 그러네요. 제 방이 어딘지도 모르시겠네요\n고아인: 그것도 물어보고 오세요, 응?","en":"Ms. Go A-in. Yes?\nCONGRATULATIONS ON YOUR APPOINTMENT, MANAGING DIRECTOR KANG HAN-NA\nYou have to tell me where your office is. You're right.\nYou don't even know where my office is.\nDo you? You should ask around and find out.","start":112.387321,"end":143.453229,"viStart":75.357138,"viEnd":111.945982,"koStart":112.387321,"koEnd":143.453229,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":75.357138,"end":111.945982},"koRange":{"start":112.387321,"end":143.453229}},{"id":12,"sourceUid":"merged-muy7n5ly-5","sourceNo":12,"originalSourceNo":33,"displayNo":12,"vi":"Vậy cái này còn ích gì nữa?","ko":"서장우: 이게 무슨 소용이 있어요?","en":"Does this mean anything now?","start":161.131564,"end":163.029795,"viStart":126.352512,"viEnd":128.880585,"koStart":161.131564,"koEnd":163.029795,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":126.352512,"end":128.880585},"koRange":{"start":161.131564,"end":163.029795}},{"id":13,"sourceUid":"merged-muy7nak2-6","sourceNo":13,"originalSourceNo":35,"displayNo":13,"vi":"[thở dài]\n[Âm nhạc thú vị]","ko":"[한숨]\n[흥미로운 음악]","en":"[sigh]\n[Interesting music]","start":191.77,"end":194.02,"viStart":191.77,"viEnd":194.02,"koStart":191.77,"koEnd":194.02,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":15,"sourceUid":"merged-muy7v04m-9","sourceNo":15,"originalSourceNo":41,"displayNo":15,"vi":"Tức chết đi được!\nẢ điên đó dám nói vậy với tôi!\nTrợ lý Park. Đuổi cổ chị ta ngay lập tức cho tôi.\nCầm trợ cấp thất nghiệp biến đi!\nTôi bảo sa thải chị ta, Trợ lý Park.\nSao anh không trả lời?\nMấy người hùa vào coi thường tôi đấy hả?","ko":"강한나: 짜증 나!\n강한나: 완전 미친년 아니야, 어? 얻다 대고 지금\n강한나: 박 차장, 저거 잘라\n강한나: 당장, 빨리\n강한나: 실업 수당이나 받으라고 해\n강한나: 자르라고 박 차장, 왜 대답 안 해?\n강한나: 오늘 나 무시하기로 다들 약속한 날이야?\n강한나: 어? 그런 거야?","en":"I'm about to explode!\nShe must've lost her mind\nto say those things to me!\nMr. Park, fire her right now.\nJust give her unemployment benefits!\nI said to fire her, Mr. Park.\nWhy aren't you answering me?\nDid you all plan to look down on me or something?","start":208.353235,"end":233.062964,"viStart":174.25583,"viEnd":199.098887,"koStart":208.353235,"koEnd":233.062964,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":174.25583,"end":199.098887},"koRange":{"start":208.353235,"end":233.062964}},{"id":16,"sourceUid":"merged-muy7x74z-10","sourceNo":16,"originalSourceNo":43,"displayNo":16,"vi":"[âm nhạc đen tối]\n[Tiếng hét giận dữ của Hannah]\n[Thở gấp]\n[Hơi thở nặng nề của Hannah]","ko":"[어두운 음악]\n[한나의 성난 비명]\n[거친 숨소리]\n[한나의 거친 숨소리]","en":"[dark music]\n[Hannah's angry scream]\n[Rough breathing]\n[Hannah’s heavy breathing]","start":244.53,"end":246.37,"viStart":244.53,"viEnd":246.37,"koStart":244.53,"koEnd":246.37,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":17,"sourceUid":"merged-muy85q3d-11","sourceNo":17,"originalSourceNo":52,"displayNo":17,"vi":"Giám đốc, tôi đang nói chuyện với phòng nhân sự.\nPHÒNG NHÂN SỰ TẬP ĐOÀN VC KIM JONG HYEOK\nĐược rồi. Gọi tiếp đi. Đúng vậy.\nTôi hiểu rồi. Vâng.","ko":"박영우: 상무님, 지금 본사 인사 팀이랑 통화 중입니다\n강한나: 알았어, 통화해\n박영우: 네, 그렇네요. 알겠습니다, 네","en":"Ms. Kang, I'm speaking to HR right now.\nVC GROUP HR KIM JONG-HYEOK\nFine. Go ahead. All right.\nI understand. Goodbye.","start":233.062964,"end":248.716116,"viStart":199.098887,"viEnd":214.857068,"koStart":233.062964,"koEnd":248.716116,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":199.098887,"end":214.857068},"koRange":{"start":233.062964,"end":248.716116}},{"id":18,"sourceUid":"ko-muwto5ln-1010","sourceNo":18,"originalSourceNo":49,"displayNo":18,"vi":"[Hết cơn ho]\n[Âm nhạc thú vị]","ko":"[헛기침]\n[흥미로운 음악]","en":"[Clears cough]\n[Interesting music]","start":262.05,"end":263.09,"viStart":262.05,"viEnd":263.09,"koStart":262.05,"koEnd":263.09,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":19,"sourceUid":"merged-muy8odn4-13","sourceNo":19,"originalSourceNo":58,"displayNo":19,"vi":"Họ bảo không được.\nĐấy. Không được đúng không?\nPhòng nhân sự chắc cũng đang ầm ĩ cả rồi.\nSao có thể để loại người đó ở đây chứ?\nLại còn là nhân sự cấp cao.\nKhông, không phải ý đó. Vậy thì là gì?","ko":"박영우: 안 되겠답니다\n강한나: 그렇지? 안 되겠다지?\n강한나: 본사 인사 팀도 지금 난리 났겠지\n강한나: 어떻게 저런 걸 내 회사에\n강한나: 아, 그것도 임원으로 둬?\n박영우: 아니요, 그거 말고요\n강한나: 그럼 뭐?","en":"They can't allow it.\nSee? They can't allow this.\nI'm sure HR is in an uproar right now.\nI can't keep that thing in my company.\nAs an executive at that.\nActually, that's not what I meant. Then what?","start":252.496662,"end":267.917513,"viStart":214.857068,"viEnd":236.021885,"koStart":252.496662,"koEnd":267.917513,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":214.857068,"end":236.021885},"koRange":{"start":252.496662,"end":267.917513}},{"id":20,"sourceUid":"merged-muy8wmdz-14","sourceNo":20,"originalSourceNo":66,"displayNo":20,"vi":"Họ bảo không sa thải được. Tại sao?\nTại sao? Không thể sa thải bừa bãi vậy đâu.\nLuật lao động nước ta chặt chẽ lắm.\nVả lại, Giám đốc Go A In hiện đang là gương mặt của tập đoàn.\nGương mặt cái khỉ. Cô ấy đại diện cho một tập đoàn bình đẳng giới và chú trọng năng lực.","ko":"박영우: 못 자른답니다\n강한나, 박영우: 왜? 왜, 왜! 사람 그렇게 막 못 잘라요\n박영우: 우리나라 노동법이 얼마나 철저한데\n박영우: 그리고 고아인 상무가 지금 그룹의 얼굴이랍니다\n강한나, 박영우: 무슨 얼굴? 여성 친화적 실력 우선주의 그룹이라는 이미지 담당이라고","en":"They can't fire her. What?\nWhy not? You can't fire people that easily.\nOur labor laws are strict.\nPlus, Director Go A-in practically represents our company.\nRepresent, my foot. She represents a gender-equal and performance-oriented company.","start":267.917513,"end":284.444279,"viStart":238.663154,"viEnd":251.100343,"koStart":267.917513,"koEnd":284.444279,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":238.663154,"end":251.100343},"koRange":{"start":267.917513,"end":284.444279}},{"id":21,"sourceUid":"merged-muy9f2lh-15","sourceNo":21,"originalSourceNo":75,"displayNo":21,"vi":"Lên được vài trang báo là đã thành gương mặt đại diện đấy à?\nChưa được một tháng đã sa thải người lên vài trang báo thì liệu công chúng có để yên?\nVới cả, cô ấy là cái cớ để cô được bổ nhiệm làm nhân sự cấp cao mà không cần làm nhân viên quèn đấy.\nCô cũng hiểu rõ mà. Vậy thì sao?\nAnh bảo tôi phải chịu đựng chị ta?","ko":"강한나: 기사 몇 개 나왔다고 뭔 얼굴이야 저런 미친년이\n박영우: 기사 몇 개 나온 사람 한 달도 안 돼서 해고하면 사람들이 가만히 있겠어요?\n박영우: 게다가 상무님 평사원 거치지 않고 바로 임원 달아 주기 위한 얼굴마담이라는데\n박영우: 이건 상무님도 아시잖아요\n강한나: 아, 그럼 저걸 계속 보면서 살라고?","en":"How can that nutjob represent our company with a few articles?\nYou say a few articles, but if we fire her in a month, the public will bash us.\nAlso, she's a good excuse to appoint you as an executive even though you aren't experienced.\nAnd you already know that. Then what?\nYou want me to put up with her?","start":287.963463,"end":308.745141,"viStart":251.100343,"viEnd":274.932724,"koStart":287.963463,"koEnd":308.745141,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":251.100343,"end":274.932724},"koRange":{"start":287.963463,"end":308.745141}},{"id":22,"sourceUid":"merged-muy9k6l4-16","sourceNo":22,"originalSourceNo":76,"displayNo":22,"vi":"[cười]\n[thở dài khó chịu]","ko":"[헛웃음]\n[짜증 섞인 한숨]","en":"[laughter]\n[annoyed sigh]","start":332.99,"end":334.29,"viStart":332.99,"viEnd":334.29,"koStart":332.99,"koEnd":334.29,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":24,"sourceUid":"merged-mv0pbvvj-1","sourceNo":24,"originalSourceNo":82,"displayNo":24,"vi":"Này, Đội phó Han.\nVâng? Anh nên kiềm chế sếp của anh đi.\nĐúng không ạ? Cậu ta thì có tội tình gì đâu.\nChỉ là gặp nhầm sếp thôi.\nĐến con chó còn biết nhận chủ.\nCòn cô ta thì… Đụng ai cũng nhe nanh múa vuốt.","ko":"권우철: 야, 한 부장\n한병수: 예?\n권우철: 니네 상무님 관리 좀 해야겠다?\n권우철: 그렇죠?\n최창수: 얘가 뭔 죄야\n최창수: 상사 잘못 만난 거 말고\n최창수: 똥개도 주인은 알아보는 법인데\n최창수: 이건 뭐…\n최창수: 아무한테나 이빨을 드러내니, 참","en":"Manager Han.\nYes? Keep your boss under control.\nDon't you agree? He didn't do anything wrong.\nHe just met the wrong boss.\nEven a dog recognizes its owner.\nBut she… She just bites everyone in her way.","start":323.213552,"end":346.405771,"viStart":288.520661,"viEnd":312.930501,"koStart":323.213552,"koEnd":346.405771,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":288.520661,"end":312.930501},"koRange":{"start":323.213552,"end":346.405771}},{"id":25,"sourceUid":"ko-muwto5ln-1045","sourceNo":25,"originalSourceNo":84,"displayNo":25,"vi":"[Tiếng cười của Changsu và Woocheol]","ko":"[창수, 우철의 웃음]","en":"[Changsu and Woocheol’s laughter]","start":363.15,"end":365.11,"viStart":363.15,"viEnd":365.11,"koStart":363.15,"koEnd":365.11,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":26,"sourceUid":"merged-mv0x1755-1","sourceNo":26,"originalSourceNo":94,"displayNo":26,"vi":"Đội phó Han. Vâng. Cậu nên đưa ra quyết định thôi.\nChuyện gì ạ? Đừng sát cánh bên con chó điên kẻo không dưng lại phải đổ máu.\nChẳng phải đã đến lúc cậu nên dần cắt đứt với Go A In rồi sao?\nTôi hiểu tình cảnh của cậu.\nĐâu thể phớt lờ người sếp mình đã đi theo mười năm trong một sớm một chiều.\nĐội phó Han vốn là người tình nghĩa mà.\nNhưng vẫn có một thứ gọi là giới hạn.","ko":"최창수, 한병수: 한 부장. 예. 이제 결정해야지? 뭐를요?\n최창수: 미친 똥개 옆에 같이 있다가 괜히 피 보지 말고\n최창수: 고아인 슬슬 손절해야 하지 않겠어?\n최창수: 네 입장 알아 10년 모신 상사를 하루아침에 바로 모른 척할 순 없겠지\n최창수: 아, 한 부장이 원래 의리는 있잖아요\n최창수: 그래도 선이라는 게 있는데","en":"Manager Han. Yes, sir. It's about time you decided. Decide what?\nDon't side with that crazy dog and take the fall with her.\nIt's time you start cutting her off.\nI understand your situation.\nYou worked with her for ten years.\nIt can't be easy to cut her off.\nHe really is the loyal type.\nBut there's a thing called a line.","start":346.405771,"end":382.405853,"viStart":312.930501,"viEnd":348.474929,"koStart":346.405771,"koEnd":382.405853,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":312.930501,"end":348.474929},"koRange":{"start":346.405771,"end":382.405853}},{"id":27,"sourceUid":"merged-mv13breu-1","sourceNo":27,"originalSourceNo":103,"displayNo":27,"vi":"Hôm nay, cô ta đã quá đi xa rồi.\nGửi email cho khách hàng, xem thường giám đốc Kang.\nKhông phải cô ta xấu tính mà là bị điên luôn rồi còn gì?\nCậu cứ từ từ nghĩ đi.\nTôi không bảo cậu phải trả lời ngay.\nCảm ơn anh đã có lời.","ko":"차성우: 오늘 일은 너무 넘었잖아\n최창수: 광고주 일이나 한나 상무님한테 한 말이나\n권우철: 저거는 성격이 드러운 게 아니라 완전히 미친 거잖아\n최창수: 천천히 생각해 봐 당장 대답하라는 건 아니니까\n한병수: 말씀 감사합니다","en":"And she crossed it too far today.\nShe sent those emails to the clients and spoke out of line to Ms. Kang.\nShe's just pure crazy at this point.\nThink about it.\nI'm not asking for an answer right now.\nThank you for your words.","start":382.405853,"end":409.270523,"viStart":348.474929,"viEnd":375.526176,"koStart":382.405853,"koEnd":409.270523,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":348.474929,"end":375.526176},"koRange":{"start":382.405853,"end":409.270523}},{"id":28,"sourceUid":"ko-muwto5ln-1063","sourceNo":28,"originalSourceNo":102,"displayNo":28,"vi":"[Âm nhạc ý nghĩa]\n[Âm thanh thang máy đến]","ko":"[의미심장한 음악]\n[엘리베이터 도착음]","en":"[Meaningful music]\n[Elevator arrival sound]","start":429.8,"end":430.97,"viStart":429.8,"viEnd":430.97,"koStart":429.8,"koEnd":430.97,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":29,"sourceUid":"merged-mv13l31h-2","sourceNo":29,"originalSourceNo":105,"displayNo":29,"vi":"Chúng ta hãy cùng nhau làm quảng cáo thật lâu nhé. Vâng.","ko":"최창수: 같이 광고 오래 하자. 네","en":"I hope we can work together for a long time. Okay.","start":417.240632,"end":421.545253,"viStart":382.833387,"viEnd":393.833387,"koStart":417.240632,"koEnd":421.545253,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":382.833387,"end":393.833387},"koRange":{"start":417.240632,"end":421.545253}},{"id":31,"sourceUid":"merged-mv13loic-4","sourceNo":31,"originalSourceNo":107,"displayNo":31,"vi":"[Tiếng gõ cửa]\n[Tiếng đóng cửa]","ko":"[노크 소리]\n[문 닫히는 소리]","en":"[Knocking sound]\n[Sound of door closing]","start":460,"end":461.29,"viStart":460,"viEnd":461.29,"koStart":460,"koEnd":461.29,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":32,"sourceUid":"merged-mv13okui-6","sourceNo":32,"originalSourceNo":115,"displayNo":32,"vi":"Vất vả cho anh rồi. Nếu cô không sửa được thói quen… thì xin hãy dùng cái bút nào rẻ hơn đi.\nHãy chọn cái gì dễ xử lý hơn ấy.\nSao? Anh nghĩ tôi gây chuyện mà không xử lý được à?\nCô thanh trừng nhân viên, động đến khách hàng, giờ lại còn ăn nói tùy tiện với con gái chủ tịch.\nĐúng là rất ấn tượng.","ko":"고아인, 한병수: 수고했어. 습관을 못 고치실 거면\n한병수: 싼 걸로 하세요, 제발 감당하기 좀, 좀 쉬운 걸로\n고아인: 왜, 내가 감당 못 할 짓만 벌이는 거 같아?\n한병수: 직원들 숙청하고 광고주 건드리고 회장 딸한테 막말까지 그렇게\n한병수: 아, 뭐, 임팩트는 있었습니다","en":"If you can't get rid of your habits…\nplease use a cheaper pen.\nAt least something easy to handle.\nWhy? Do you think I'm doing something I can't handle?\nYou purged the team, involved the clients, and you even spoke out of line to the chairman's daughter.\nYou really left an impression.","start":440.163221,"end":476.760772,"viStart":405.94731,"viEnd":443.325729,"koStart":440.163221,"koEnd":476.760772,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":405.94731,"end":443.325729},"koRange":{"start":440.163221,"end":476.760772}},{"id":33,"sourceUid":"merged-mv141fn0-8","sourceNo":33,"originalSourceNo":127,"displayNo":33,"vi":"Nhưng tại sao? Rốt cuộc tại sao cô lại làm vậy?\nĐằng nào cũng chỉ trụ một năm nên cô mặc kệ hết sao?\nĐúng đấy. Vậy người khác cũng nghĩ như anh rồi.\nCô còn cười được sao?\nCô đã sỉ nhục con gái chủ tịch ngay trước bàn dân thiên hạ.\nThì sao? Kiểu gì cô ấy cũng về phe Giám đốc Choi, cô vẫy đuôi chào đón còn chưa đủ nữa kìa.","ko":"한병수: 왜 그러셨어요? 도대체 왜 그러셨어요\n한병수: 어차피 시한부 상무인 거 그냥 막 나가자 이렇게 스탠스 잡으셨어요?\n고아인, 한병수: 그렇네? 다른 사람들은 너처럼 생각하겠네. 웃음이 나오세요?\n한병수: 회장 딸 면전에다 대고 그렇게 막말을 날려 놓고\n고아인, 한병수: 그래서 뭐? 어차피 최 상무한테 붙을 사람 꼬리 흔들면서 반겨 줘도 모자랄 판에","en":"But for what? Why did you do that?\nDo you just not care anymore since you'll be gone in a year?\nYou're right. I guess others will think like you too.\nIs this funny to you?\nYou humiliated the chairman's daughter in front of everyone.\nSo what? She's going to end up on Director Choi's side, so the least you could've done was to wag your tail and kiss up.","start":476.760772,"end":506.35536,"viStart":443.325729,"viEnd":473.447556,"koStart":476.760772,"koEnd":506.35536,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":443.325729,"end":473.447556},"koRange":{"start":476.760772,"end":506.35536}},{"id":34,"sourceUid":"merged-mv14f94b-9","sourceNo":34,"originalSourceNo":120,"displayNo":34,"vi":"[cười]\n[Âm nhạc ý nghĩa]","ko":"[피식 웃는다]\n[의미심장한 음악]","en":"[laughter]\n[Meaningful music]","start":509.59,"end":510.96,"viStart":509.59,"viEnd":510.96,"koStart":509.59,"koEnd":510.96,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":35,"sourceUid":"merged-mv14jmmc-12","sourceNo":35,"originalSourceNo":138,"displayNo":35,"vi":"Chỉ lúc êm ấm mới cần đến con chó vẫy đuôi chào đón thôi.\nSao? Còn khi đi săn, ai lại dắt theo con chó như vậy?\nKhi đi săn, phải cần đến một con chó săn biết nhe nanh múa vuốt.\nTuy dữ dằn nhưng sẽ đáng tin cậy nhất khi về phe ta.\nÝ cô là… Tôi sẽ cho cô ta biết tại sao cô ta lại cần tới tôi.","ko":"고아인: 꼬리 치는 개는 평화로울 때나 필요하지\n고아인: 네? 사냥하러 먼 길 떠나야 하는데 꼬리 치는 개가 왜 필요해?\n고아인: 사냥엔 이빨을 드러내는\n고아인: 사냥개가 필요한 법이야\n고아인: 사납지만 내 편을 만들었을 때 가장 든든한\n한병수, 고아인: 그게 무슨… 알려 줘야지 내가 왜 필요한지","en":"You need a dog like that when things are peaceful.\nWhat? You don't need a welcoming dog when you're going out to hunt.\nWhen you're hunting, you need a dog that knows how to bite.\nThough it may be vicious, it's the most reliable when it's on your side.\nWhat are you… I'm going to show her why she needs me.","start":506.35536,"end":537.06375,"viStart":473.447556,"viEnd":503.259087,"koStart":506.35536,"koEnd":537.06375,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":473.447556,"end":503.259087},"koRange":{"start":506.35536,"end":537.06375}},{"id":36,"sourceUid":"merged-mv14jt6q-13","sourceNo":36,"originalSourceNo":139,"displayNo":36,"vi":"[Ain thở dài]\n[Âm nhạc thú vị]","ko":"[아인의 한숨]\n[흥미로운 음악]","en":"[Ain’s sigh]\n[Interesting music]","start":561.72,"end":562.97,"viStart":561.72,"viEnd":562.97,"koStart":561.72,"koEnd":562.97,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":37,"sourceUid":"merged-mv14ycbw-15","sourceNo":37,"originalSourceNo":145,"displayNo":37,"vi":"Cô công chúa đầy tham vọng nhưng lại không có ai về phe mình.\nCô ta sẽ sớm nhận ra thôi,\nrằng trong đêm tối một ngọn nến sẽ sáng hơn cả mặt trời.\nNếu vậy thì… Việc cô định giao cho giám đốc Kang làm là…\nPhải chờ cô ta hạ hỏa chút đã.","ko":"고아인: 욕심만 많지 그룹 내에 지 편 하나 없는 공주님이야\n고아인: 곧 알게 될 거야 \n고아인: 밤에는 태양보다 촛불이 더 밝다는 걸\n한병수: 아니, 그러면 그 한나 상무님한테 맡기신다는 일은…\n고아인: 열이 좀 식어야 대화가 되겠지?","en":"She's an ambitious little princess with no one to rely on at the company.\nSoon enough, she'll understand that a candle shines brighter than the sun at night.\nThen what about… the work that you're planning to ask her to do?\nShe'll need to blow off some steam first.","start":537.06375,"end":560.738989,"viStart":503.259087,"viEnd":527.41945,"koStart":537.06375,"koEnd":560.738989,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":503.259087,"end":527.41945},"koRange":{"start":537.06375,"end":560.738989}},{"id":38,"sourceUid":"merged-mv15dhb3-16","sourceNo":38,"originalSourceNo":152,"displayNo":38,"vi":"Đúng rồi. Sao tôi không nghĩ ra nhỉ?\nNhững lúc thế này thì quả nhiên là phải nhờ đến bố.\nSao nữa? Tôi không đăng lên mạng, chỉ gọi cho bố thôi.\nKhông được. Tuyệt đối.","ko":"강한나: 맞다. 내가 왜 그 생각을 못 했지?\n강한나: 이럴 땐 역시 아빠 찬스를\n강한나: 왜! SNS 안 해, 아빠한테 전화한다고\n박영우: 안 됩니다, 절대","en":"Right. Why didn't I think of that?\nI should just call Dad at times like these.\nWhat? I won't go on social media. I'll just call my dad.\nYou can't. Ever.","start":570.089284,"end":592.525565,"viStart":535.618489,"viEnd":558.950141,"koStart":570.089284,"koEnd":592.525565,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":535.618489,"end":558.950141},"koRange":{"start":570.089284,"end":592.525565}},{"id":39,"sourceUid":"ko-muwto5ln-1109","sourceNo":39,"originalSourceNo":148,"displayNo":39,"vi":"[Âm nhạc thú vị]","ko":"[흥미로운 음악]","en":"[Interesting music]","start":597.01,"end":598.55,"viStart":597.01,"viEnd":598.55,"koStart":597.01,"koEnd":598.55,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":40,"sourceUid":"merged-mv15psrl-20","sourceNo":40,"originalSourceNo":153,"displayNo":40,"vi":"Hôm nay mọi người làm sao vậy?\nGiám đốc. Giám đốc. Sao? Muốn gì?\nNếu cô muốn thành công thì đừng để người khác thất vọng.\nĐặc biệt là chủ tịch.\nĐây là công ty, và từ giờ tất cả đều là công việc.\nNếu cô không thể tự mình xử lý chuyện nhỏ nhặt này,\nthì liệu chủ tịch có thể tin tưởng và giao việc lớn cho cô không?","ko":"강한나: 오늘 진짜 다들 나한테 왜 이래\n박영우, 강한나: 상무님 상무님. 왜, 왜, 뭐?\n박영우: 성공하고 싶으시면 상대에게 실망할 여지를 주지 마세요\n박영우: 특히나 회장님한테는 더\n박영우: 여긴 회사고 지금부터는 다 비즈니스입니다\n박영우: 이런 사소한 일도 직접 해결하지 못하면\n박영우: 회장님께서 상무님 믿고 큰일 맡기시겠어요?","en":"What's with everyone today?\nMs. Kang. Ms. Kang. What do you want?\nIf you want to be successful, don't disappoint others.\nEspecially the chairman.\nYou're working for a company, and everything is a business now.\nIf you can't even resolve small matters yourself,\nhow can the chairman let you handle bigger projects?","start":597.187969,"end":627.235277,"viStart":563.881878,"viEnd":593.411855,"koStart":597.187969,"koEnd":627.235277,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":563.881878,"end":593.411855},"koRange":{"start":597.187969,"end":627.235277}},{"id":41,"sourceUid":"ko-muwto5ln-1120","sourceNo":41,"originalSourceNo":159,"displayNo":41,"vi":"[Âm nhạc ý nghĩa]","ko":"[의미심장한 음악]","en":"[Meaningful music]","start":638.09,"end":639.76,"viStart":638.09,"viEnd":639.76,"koStart":638.09,"koEnd":639.76,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":42,"sourceUid":"merged-mv1nuio5-22","sourceNo":42,"originalSourceNo":161,"displayNo":42,"vi":"Cơ hội chỉ đến khi cô biến những việc không thể thành có thể.\nTrừ tôi ra thì mấy người ai chả giỏi.\nTôi biết rồi. Nhưng tôi vẫn cứ tức thì phải tính sao?\nNhẫn nhịn à? Cắn răng chịu đựng để thành ung thư luôn à?\nHay tôi tức chết luôn cho rồi? Vâng. Gì hả?\nCô không chết được đâu. Hãy nhẫn nhịn đi. Vậy thì\ntôi chỉ cần tìm đến người mà tôi có thể gây thất vọng thôi.","ko":"박영우: 불가능해 보이는 일도 가능하게 만들어야 기회가 옵니다.\n강한나: 치. 다들 나 빼고 훌륭하지\n강한나: 알았어. 아, 그래도 짜증이 나는 걸 어떡하라고. 그냥 참아?\n강한나: 강한나: 꾹꾹 참아서 이 화를 암세포로 쑥쑥 키워?\n강한나: 이대로 그냥 화병으로 확 죽어 버릴까? 네. 뭐?\n박영우: 안 죽습니다. 참으세요. 씨… 아씨. \n강한나: 그럼 실망의 여지를 줘도 되는 사람한테 가면 되는 거잖아","en":"Your chance will come when you make the impossible possible.\nHow noble of everyone.\nFine. But I'm still so annoyed!\nDo I just endure it? What if I endure it too much and get cancer?\nWhat if I die from holding it in too much? Sure. What?\nYou won't die. Endure it. That means\nI can take this to someone who I won't disappoint.","start":627.235277,"end":683.643537,"viStart":593.411855,"viEnd":649.453216,"koStart":627.235277,"koEnd":683.643537,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":593.411855,"end":649.453216},"koRange":{"start":627.235277,"end":683.643537}},{"id":43,"sourceUid":"merged-mv1nv38d-23","sourceNo":43,"originalSourceNo":181,"displayNo":43,"vi":"[Hannah thở dài]\n[Hannah thở dài chán nản]\n[thở dài]\n[Âm nhạc thú vị]\n[hít một hơi]","ko":"[한나의 한숨]\n[한나의 답답한 한숨]\n[한숨]\n[흥미로운 음악]\n[숨을 들이켠다]","en":"[Hannah sighs]\n[Hannah’s frustrated sigh]\n[sigh]\n[Interesting music]\n[takes a breath]","start":698.53,"end":699.61,"viStart":698.53,"viEnd":699.61,"koStart":698.53,"koEnd":699.61,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":44,"sourceUid":"merged-mv1ov9p6-25","sourceNo":44,"originalSourceNo":191,"displayNo":44,"vi":"Đi nào. Đi đâu ạ? Tới chỗ người biết tất cả. Gandalf. Ông ơi! Ông ơi ông.\nNày. Cháu đi làm được mấy tiếng mà đã về nhà rồi?\nCháu về để hỏi ông chuyện này.\nNữ giám đốc đó, cô ta sinh ra khi nào?\nTrợ lý Park. Ả điên đó sinh năm bao nhiêu?\nCô ấy sinh năm 1981.\nSao? Ông hỏi làm gì? Tầm thời điểm đó… ông đâu có lăng nhăng với ai.\nCô ta giống hệt ông. Có khi lại là gen nhà họ Kang.\nÔng làm sao vậy? Cháu thấy sao?\nCô ta có làm ngực cháu đánh trống không?","ko":"강한나: 가자. 어딜요? 모든 걸 다 알고 있는 사람. 간달프에게로 할아버지! 할아버지! 할아버지, 할아버지\n강근철: 어. 너래 출근한 지 얼마나 됐다고 벌써 집에 오니?\n강한나: 할아버지한테 뭐 좀 물어보려고 왔지\n강근철: 그 여자 상무 생년월일이 어더렇게 되니?\n강한나: 박 차장, 미친년 몇 살이야? 81년생입니다\n강한나: 왜? 뭐 때문에 그러는데?\n강근철: 내래 그 시점에. 씁, 실수한 기억이 없는데\n강근철: 딱 내 피인데. DNA가 강씨 집안이야\n강근철: 아, 뭐야? 어떠니, 가슴이 막 두근두근 두근두근하니?","en":"Let's go. Where? To the man who knows everything. Gandalf. To Gandalf. Grandpa! Grandpa.\nHey. You're already home on your first day?\nI'm here to ask you something.\nWhen was that female managing director born?\nMr. Park. When was that lunatic born? She was born in 1981.\nWhy do you ask?\nI don't remember… being with a woman around that year.\nShe behaves like me. Maybe she's family.\nWhat? How do you feel? Does your heart race because of her?","start":687.768243,"end":754.02741,"viStart":653.883491,"viEnd":719.809,"koStart":687.768243,"koEnd":754.02741,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":653.883491,"end":719.809},"koRange":{"start":687.768243,"end":754.02741}},{"id":45,"sourceUid":"merged-mv1pwzdl-26","sourceNo":45,"originalSourceNo":213,"displayNo":45,"vi":"Cũng hơi. Điều đó là hiển nhiên vì cháu tức mà.\nTức lên một cái đã bỏ hết công việc chạy đến đây à?\nNhững kẻ điên thường rất giỏi nhận ra nhau.\nVì giống nhau mà.\nĐụng vào nhau là lửa bắn tung tóe ngay.\nSao lại so sánh cô ta với cháu chứ?\nHãy để mắt đến cô giám đốc đó.","ko":"강한나: 뭐, 약간? 당연하지, 짜증 나니까\n강근철: 짜증 난다고 일 다 내팽개치고 날 찾아왔어?\n강근철: 원래 또라이가 또라이를 바로 알아보디 서로 비스무레하니까\n강근철: 붙으면 불도 튀는 거이고\n강한나: 아, 기분 나쁘게 왜 그런 거랑 날 비교해\n강근철: 그 상무 잘 지켜보라우","en":"Well, kind of. But of course, since I'm annoyed.\nYou left work just because you were annoyed?\nA lunatic knows a lunatic when they see one.\nThey're of the same kind.\nWhen they clash, it creates a spark.\nDon't compare me to something like her.\nKeep an eye on that managing director.","start":754.02741,"end":779.616107,"viStart":719.809,"viEnd":746.343291,"koStart":754.02741,"koEnd":779.616107,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":719.809,"end":746.343291},"koRange":{"start":754.02741,"end":779.616107}},{"id":46,"sourceUid":"merged-mv1vuyen-32","sourceNo":46,"originalSourceNo":221,"displayNo":46,"vi":"[Âm nhạc thú vị] [Cười]\n[Âm nhạc ý nghĩa]","ko":"[흥미로운 음악][웃음]\n[의미심장한 음악]","en":"[Interesting music] [Laughs]\n[Meaningful music]","start":823.94,"end":826.15,"viStart":823.94,"viEnd":826.15,"koStart":823.94,"koEnd":826.15,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":47,"sourceUid":"merged-mv1vwfn8-33","sourceNo":47,"originalSourceNo":222,"displayNo":47,"vi":"Nếu chỉ vì cảm tính mà nói những lời đó\nthì thân là đàn bà, sẽ chẳng leo lên được tới vị trí đó đâu.\nCô ta có lý do cả đấy.\nDù vậy đi chăng nữa…\nHan Na, cháu đừng có quên lời ông.\nKhông được coi tất cả nô bộc như nhau.\nCó những tên nô bộc thông minh và giỏi suy nghĩ hơn chủ.\nTÔI RẤT TRÔNG ĐỢI VÀO CÔ","ko":"강한나: 감정적으로 그런 말 하는 종자면\n강한나: 여자가 회사에서 거기까지 못 올라오디\n강근철: 고럼, 음\n강근철: 다 이유가 있어서 그런 거야\n강한나: 아니, 그래도…\n강근철: 한나 너래 내 말 잊디 말라우\n강근철: 머슴이라고 다 같은 머슴으로 보면 안 돼야\n강근철: 주인보다 요 머리통 굴리는 게 신묘한 머슴들이 있디","en":"If that was just an emotional outburst,\nshe wouldn't have made it that far in the company.\nShe said those things for a reason.\nBut still… Han-na, don't forget what I said.\nNot all servants are the same.\nThere are clever servants who are smarter than their owners.\nWE'RE EXPECTING A LOT FROM YOU","start":779.616107,"end":807.041807,"viStart":746.343291,"viEnd":778.753357,"koStart":779.616107,"koEnd":807.041807,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":746.343291,"end":778.753357},"koRange":{"start":779.616107,"end":807.041807}},{"id":48,"sourceUid":"merged-mv1qabqc-31","sourceNo":48,"originalSourceNo":213,"displayNo":48,"vi":"Đừng đố kỵ với những loại nô bộc như vậy. Mà phải biến chúng thành người của cháu.\nKhông thích. Sao cháu phải về cùng phe chị ta?\nAi bảo cháu về phe cô ta?\nVậy thì là gì?\nĐẩy cho cô ta những việc mà cháu không giải quyết được.\nNếu làm được thì về phe cháu.\nCòn không thì… xin vĩnh biệt luôn.\nKhông gì thảm hơn việc chủ mà lại đi ghen tị với tôi tớ đâu.","ko":"강근철: 그럴 땐 시기 질투 하지 말고\n강근철: 반드시 니 사람으로 만들어야 한다\n강한나: 싫어. 내가 왜 그런 거랑 한편을 먹어?\n강근철: 아, 누가 한편 먹으랬니?\n강근철: 그럼? 니가 절대 해결 못 할 일을 맡기면 되지\n강근철: 해내면 내 편, 못 해내면\n강근철: 영원히 빠이빠이지\n강근철: 주인이 머슴 질투하는 것만큼 흉한 거 없어야","en":"Don't get jealous when you see such servants.\nJust make sure they end up working for you.\nNo. I don't want to side with her.\nWho said to side with her?\nThen what? Give her things you can't handle.\nIf she handles it, she's on your side.\nIf she can't… she's out forever. \nIt's the most pathetic when an owner is jealous of a servant.","start":818.61251,"end":855.593502,"viStart":784.365249,"viEnd":822.187653,"koStart":818.61251,"koEnd":855.593502,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":784.365249,"end":822.187653},"koRange":{"start":818.61251,"end":855.593502}},{"id":49,"sourceUid":"merged-mv1ytgoz-36","sourceNo":49,"originalSourceNo":241,"displayNo":49,"vi":"[Âm nhạc thú vị]\n[Cùng nhau cười] [Tiếng hôn nhau]\n[cười] [âm nhạc thú vị]","ko":"[흥미로운 음악]\n[함께 웃는다][쪽 뽀뽀하는 소리]\n[웃음][흥미로운 음악]","en":"[Interesting music]\n[Laughing together] [Sound of kissing each other]\n[laughter] [interesting music]","start":822.187653,"end":847.712497,"viStart":822.187653,"viEnd":847.712497,"koStart":822.187653,"koEnd":847.712497,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":50,"sourceUid":"merged-mv1yr5is-34","sourceNo":50,"originalSourceNo":244,"displayNo":50,"vi":"Quả không hổ danh Gandalf.\nĐúng là chẳng có gì mà ông không biết cả.\nNày, đủ rồi. Dính nước bọt ra ông bây giờ.\nPhải đánh dấu chủ quyền chứ.\nÔng nuôi cháu làm người mà sao lại thành con cún thế này?\nCòn đợi gì nữa? Dạ? Đi đi. Làm việc đi chứ.","ko":"강한나: 음, 역시 간달프 다 알아, 모르는 게 없다니까?\n강근철: 야, 야, 야, 야 고만하라우, 야, 야, 침 묻는다\n강한나: 내 거니까 침 발라야지\n강근철: 사람 새끼로 키워 놨더니 어찌 강아지 새끼가 됐어\n강근철: 뭐 하니? 응? 가라우. 일해야디","en":"I knew you'd have all the answers.\nYou know everything, Gandalf.\nHey, stop it. I don't want you drooling on me.\nYou're mine, so it's okay.\nI raised you as a human, but you've become a puppy.\nWhat are you waiting for? What? Go now. You should go work.","start":860.045928,"end":882.549,"viStart":822.187653,"viEnd":847.712,"koStart":860.045928,"koEnd":882.549,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":822.187653,"end":847.712},"koRange":{"start":860.045928,"end":882.549}},{"id":51,"sourceUid":"merged-mv1yzyxv-37","sourceNo":51,"originalSourceNo":234,"displayNo":51,"vi":"Trợ lý Park. Lát đến công ty là tổng hợp ngay tất cả tài liệu về Go A In cho tôi.\nTôi tổng hợp sẵn rồi.\nĐúng là tên nô bộc thông minh.\nDạ? Không cần để ý đâu.","ko":"강한나: 박 차장. 들어가자마자 고아인 상무 파일 전부 모아서 나한테 줘\n박영우: 이미 모아 놨습니다\n강한나: 음, 역시 신묘한 머슴이야\n박영우, 강한나: 네? 있어, 그런 게","en":"Mr. Park. As soon as we get to the office, give me all the files on Director Go.\nI already have them ready.\nYou're such a smart servant.\nSorry? None of your business.","start":882.549,"end":899.23,"viStart":847.712497,"viEnd":865.812465,"koStart":882.549,"koEnd":899.23,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":847.712497,"end":865.812465},"koRange":{"start":882.549,"end":899.23}},{"id":52,"sourceUid":"merged-mv22vqtf-41","sourceNo":52,"originalSourceNo":251,"displayNo":52,"vi":"[Âm thanh thao tác bàn phím]\n[Thở dài của Eunjeong]","ko":"[키보드 조작음]\n[은정의 한숨]","en":"[Keyboard operation sound]\n[Eunjeong’s sigh]","start":932.89,"end":934.64,"viStart":932.89,"viEnd":934.64,"koStart":932.89,"koEnd":934.64,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":53,"sourceUid":"merged-mv22sdnk-38","sourceNo":53,"originalSourceNo":256,"displayNo":53,"vi":"Đi ăn trưa thôi nào.\nTôi vẫn còn việc phải làm. Việc gì?\nVậy hôm nay có hai chúng ta thôi. Đi nào.","ko":"한병수: 점심, 점심 먹으러 가자\n조은정: 아, 저는 처리할 일이 있어서… 무슨 일?\n서장우: 아, 부장님, 오늘은 둘이 가시죠. 자, 가시죠","en":"Let's go get lunch.\nI have some work to do, so I can't go. What work?\nI guess it's just the two of us today. Let's go.","start":917.317942,"end":930.148402,"viStart":883.669971,"viEnd":899.160583,"koStart":917.317942,"koEnd":930.148402,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":883.669971,"end":899.160583},"koRange":{"start":917.317942,"end":930.148402}},{"id":55,"sourceUid":"merged-mv22v9oa-40","sourceNo":55,"originalSourceNo":246,"displayNo":55,"vi":"Mình cũng muốn nhận đơn xin rút.","ko":"조은정: 나도 철회서 받고 싶다","en":"I wish I had a withdrawal form too.","start":949.139241,"end":951.821146,"viStart":914.864665,"viEnd":918.028562,"koStart":949.139241,"koEnd":951.821146,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":914.864665,"end":918.028562},"koRange":{"start":949.139241,"end":951.821146}},{"id":56,"sourceUid":"ko-muwto5ln-1220","sourceNo":56,"originalSourceNo":259,"displayNo":56,"vi":"Anh Song A Ji. Từ giờ, hãy hỏi cho ra nhẽ rồi hẵng bướng bỉnh.\nĐừng có không biết gì mà cứ bắt tôi phải nghỉ việc.\nXem lại xem có lỗi đánh máy không nào.\n\"Vì lý do cá nhân\".\nNghe hơi chung chung, đổi thành \"Hoàn cảnh gia đình\" vậy.\nAi lại đi soát lỗi chính tả trong đơn xin thôi việc chứ?\nTrời ạ, căn bệnh nghề nghiệp chết tiệt!","ko":"조은정: 송아지 씨? 앞으론 물어보면서 땡깡 부리세요\n조은정: 아무것도 모르면서 그만두라 어쩌라 하지 마시고\n조은정: 오타 있나 다시 한번\n조은정: '일신상의'…\n조은정: 아, 어려운 단어니까 쉽게 '개인적인 사유'\n조은정: 누가 사직서를 와싱하냐고!\n조은정: 아유, 직업병, 직업병, 으!","en":"Mr. Song A-ji. Please ask for my permission before you start whining.\nDon't tell me to quit when you don't even know anything.\nLet's check if there are any typos.\n\"Due to personal reasons…\"\nInstead of that, let's go with this.\n\"Due to private matters…\"\nWhat kind of person proofreads their resignation letter?\nGosh, stupid work habits!","start":959.691,"end":999.553,"viStart":925.453,"viEnd":966.929,"koStart":959.691,"koEnd":999.553,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":925.453,"end":966.929},"koRange":{"start":959.691,"end":999.553}},{"id":57,"sourceUid":"vi-muwto2my-274","sourceNo":57,"originalSourceNo":274,"displayNo":57,"vi":"Vào đi. Giám đốc Go. Sao vậy?\nTôi xin lỗi. Chuyện gì?","ko":"고아인: 들어와. \n조은정, 고아인: 저, 상무님. 왜. 죄송합니. 뭘","en":"Come in. Ms. Go. What is it?\nI'm sorry. About what?","start":1002.046689,"end":1027.337865,"viStart":966.929381,"viEnd":993.210703,"koStart":1002.046689,"koEnd":1027.337865,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":966.929381,"end":993.210703},"koRange":{"start":1002.046689,"end":1027.337865}},{"id":58,"sourceUid":"merged-mv2jrxl3-6","sourceNo":58,"originalSourceNo":287,"displayNo":58,"vi":"Sao anh bảo không được sa thải?\nThế đây là gì? Họ không bị sa thải, mà là chuyển sang vị trí thấp hơn.\nTại sao lại thế? Cô ấy muốn cho họ thấy ai là sếp.\nVì cô ấy không có ai về phe mình. \nKhông có bè phái hay chỗ chống lưng nên làm khùng điên để ra oai?\nĐại loại như vậy. Có điều,\nđây là quyền hợp pháp của cô ấy.","ko":"강한나: 해고 안 된다며 이건 뭐야?\n박영우: 아, 이거 해고 아니고요\n박영우: 한직으로 인사이동만 시켰습니다\n강한나: 왜 이러는 건데?\n박영우: 누가 대장인지 보여 주는 거죠\n박영우: 회사 내에 라인이 없으니까\n강한나: 줄도 백도 없으니까 똘끼로 밀어붙인다?\n박영우: 비슷하죠, 다만 합법적인 권한으로 한다는 거?","en":"I thought you couldn't fire people.\nThen what's this? They weren't fired.\nThey were moved to less important teams.\nWhat's the point of this?\nShe's trying to prove who their boss is.\nBecause she has no one on her side.\nShe's using her insanity as a weapon since she has no connections?\nSomething like that. But these are all within her power.","start":1041.805257,"end":1068.281994,"viStart":1007.920362,"viEnd":1033.846439,"koStart":1041.805257,"koEnd":1068.281994,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1007.920362,"end":1033.846439},"koRange":{"start":1041.805257,"end":1068.281994}},{"id":59,"sourceUid":"merged-mv2jpe0f-4","sourceNo":59,"originalSourceNo":276,"displayNo":59,"vi":"[Tiếng gõ cửa]\n[Âm thanh hoạt động của máy tính bảng]","ko":"[노크 소리]\n[태블릿 피시 조작음]","en":"[Knocking sound]\n[Tablet PC operation sound]","start":1057.18,"end":1059.34,"viStart":1057.18,"viEnd":1059.34,"koStart":1057.18,"koEnd":1059.34,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":61,"sourceUid":"ko-muwto5ln-1245","sourceNo":61,"originalSourceNo":284,"displayNo":61,"vi":"[Âm nhạc ý nghĩa]","ko":"[의미심장한 음악]","en":"[Meaningful music]","start":1081.41,"end":1083.45,"viStart":1081.41,"viEnd":1083.45,"koStart":1081.41,"koEnd":1083.45,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":62,"sourceUid":"merged-mv2kbuum-7","sourceNo":62,"originalSourceNo":295,"displayNo":62,"vi":"Vậy là ông nói đúng. Ngài ấy nói gì ạ?\nBiết vậy đi.\nTrời, nhìn chị ta kìa. Đúng là giống hệt tôi.\nKhác hoàn toàn mà.\nNói cái gì vậy? Kiểu người suy nghĩ chiến lược rồi hành động như kẻ điên.","ko":"강한나: 할아버지 말이 맞네\n박영우: 뭐라고 하셨는데요?\n강한나: 있어, 아, 요것 봐라 이거 딱 내 과네\n박영우: 완전히 다른 과 같은데요?\n강한나: 무슨 소리야? 전략적으로 생각하고 미친년처럼 행동하는 타입","en":"So Grandpa was right. What did he say? Something.\nGosh, look at her. She's totally like me.\nYou're totally different.\nWhat are you saying? She's the type who thinks strategically but acts crazy.","start":1071.732878,"end":1092.816316,"viStart":1033.846439,"viEnd":1058.305759,"koStart":1071.732878,"koEnd":1092.816316,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1033.846439,"end":1058.305759},"koRange":{"start":1071.732878,"end":1092.816316}},{"id":63,"sourceUid":"merged-mv2kgx7x-8","sourceNo":63,"originalSourceNo":282,"displayNo":63,"vi":"Giống hệt tôi còn gì. Trợ lý Park thấy sao?\nNghe cô nói vậy… tôi thấy cũng có một vế đúng.\nVế trước? Hay vế sau?","ko":"강한나: 딱 내 과 맞구먼. 박 차장 생각은 어때?\n박영우: 뭐, 듣고 보니. \n박영우: 둘 중의 하나는 확실히 맞는 거 같습니다\n강한나: 전자? 아님 후자?","en":"She's just like me. What do you think, Mr. Park?\nNow that you say it… one of them definitely is you.\nThe former? Or the latter?","start":1092.586838,"end":1106.513006,"viStart":1058.305759,"viEnd":1072.46371,"koStart":1092.586838,"koEnd":1106.513006,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1058.305759,"end":1072.46371},"koRange":{"start":1092.586838,"end":1106.513006}},{"id":64,"sourceUid":"ko-muwto5ln-1261","sourceNo":64,"originalSourceNo":300,"displayNo":64,"vi":"[Âm nhạc thú vị]","ko":"[흥미로운 음악]","en":"[Interesting music]","start":1125.54,"end":1126.62,"viStart":1125.54,"viEnd":1126.62,"koStart":1125.54,"koEnd":1126.62,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":65,"sourceUid":"merged-mv3cculj-2","sourceNo":65,"originalSourceNo":294,"displayNo":65,"vi":"Vẻ mặt này ý là vế sau đây mà.\nLà vậy sao? Anh cũng muốn lấy trợ cấp thất nghiệp à?\nVậy là cô chịu trả tự do cho tôi rồi à?\nCuối cùng tôi cũng được trở về công ty con\nlàm việc như các đồng nghiệp sao?\nKhông được. Tôi rút lại lời vừa nãy.","ko":"강한나: 표정이 딱 후자인데\n강한나: 그런 거야? 박 차장도 실업 수당 받고 싶은 거야?\n박영우: 어, 그럼 저 이제 놓아주시는 거예요?\n박영우: 계열사로 돌아가서 제 동기들처럼\n박영우: 진짜 회사원처럼 일할 수 있는 거예요?\n강한나: 그건 안 돼, 실업 수당 취소","en":"Your face is telling me it's the latter.\nIs that it? Do you also want to get fired?\nDoes this mean that I'm finally free?\nCan I finally work like my colleagues\nfor one of the subsidiaries?\nNo. I take that back.","start":1106.513006,"end":1129.793913,"viStart":1072.46371,"viEnd":1096.12744,"koStart":1106.513006,"koEnd":1129.793913,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1072.46371,"end":1096.12744},"koRange":{"start":1106.513006,"end":1129.793913}},{"id":66,"sourceUid":"ko-muwto5ln-1271","sourceNo":66,"originalSourceNo":310,"displayNo":66,"vi":"[Thở dài của Eunjeong]","ko":"[은정의 한숨]","en":"[Eunjeong’s sigh]","start":1172.29,"end":1173.29,"viStart":1172.29,"viEnd":1173.29,"koStart":1172.29,"koEnd":1173.29,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":67,"sourceUid":"merged-mv3cxwnf-3","sourceNo":67,"originalSourceNo":312,"displayNo":67,"vi":"Thả lỏng nào. Mình làm được.","ko":"조은정: 릴랙스, 할 수 있어, 할 수 있어","en":"Relax. You can do it.","start":1157.309988,"end":1161.36187,"viStart":1157.309988,"viEnd":1161.36187,"koStart":1157.309988,"koEnd":1161.36187,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":1157.309988,"end":1161.36187}},{"id":68,"sourceUid":"merged-mv3cy8u4-4","sourceNo":68,"originalSourceNo":314,"displayNo":68,"vi":"[Thở thật sâu]\n[Âm thanh thao tác khóa cửa]\n[Âm thanh vận hành khóa cửa]","ko":"[숨을 깊게 내뱉는다]\n[도어 록 조작음]\n[도어 록 작동음]","en":"[Exhale deeply]\n[Door lock operation sound]\n[Door lock operating sound]","start":1186.64,"end":1187.76,"viStart":1186.64,"viEnd":1187.76,"koStart":1186.64,"koEnd":1187.76,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":69,"sourceUid":"merged-mv3dnbec-3","sourceNo":69,"originalSourceNo":333,"displayNo":69,"vi":"Mẹ ơi! Ừ, A Ji à. Mẹ xin nghỉ chưa?\nHả? Ừ, nhìn xem. Không còn lá đơn đúng không?\nĐúng thật. Tuyệt vời! Vui quá đi! Mẹ nghỉ việc rồi! Tuyệt quá đi mất! Cuối cùng mẹ cũng ở nhà.\nMẹ ơi, con về rồi ạ.\nỪ, vào thay đồ đi. Mẹ làm thịt lợn xào con thích đấy. Vâng ạ.\nThích quá đi! Vui quá xá! Giờ mình có thể chơi…\nRắc rối rồi.","ko":"송아지: 엄마! 어, 아지. 사표 냈어?\n조은정: 어? 어, 어, 봐 봐 아침에 있던 사표 없지? \n송아지: 진짜네? 앗싸, 신난다! 엄마 사표 냈다! 신난다!\n조은정: 어머니, 저 왔어요\n박정숙: 어, 그래, 옷 갈아입고 와라. 너 좋아하는 제육볶음 해 놨다. 아, 네\n송아지: 신난다, 완전 신나\n조은정: 큰일이네","en":"Mom! Hey, A-ji. Did you quit your job?\nWhat? Of course, look. I don't have the resignation letter.\nYou're right. Yes! This is so great! Mom finally quit! This is great! She finally gets to stay home.\nI'm home, Mother.\nGo and get changed. I made your favorite, stir-fried pork.\nAll right.\nThis is the best. Now I can be with… This is bad.","start":1169.283158,"end":1212.707999,"viStart":1134.76939,"viEnd":1179.888664,"koStart":1169.283158,"koEnd":1212.707999,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1134.76939,"end":1179.888664},"koRange":{"start":1169.283158,"end":1212.707999}},{"id":70,"sourceUid":"merged-mv3dhxpv-2","sourceNo":70,"originalSourceNo":317,"displayNo":70,"vi":"ĐƠN XIN THÔI VIỆC\n1 [Âm thanh vận hành khóa cửa]\n2 [Tiếng cười lặng lẽ]\n3 [Aji ngân nga]\n4 [Nhạc nặng]\n5 [thở dài]","ko":"1 [도어 록 작동음]\n2 [정숙의 웃음]\n3 [아지가 흥얼거린다]\n4 [무거운 음악]\n5 [한숨]","en":"RESIGNATION LETTER\n1 [Door lock operating sound]\n2 [Quiet’s laughter]\n3 [Aji hums]\n4 [Heavy Music]\n5 [sigh]","start":1179.925494,"end":1181.349616,"viStart":1179.925494,"viEnd":1181.349616,"koStart":1179.925494,"koEnd":1181.349616,"hasViAudio":true,"hasKoAudio":false,"viRange":{"start":1179.925494,"end":1181.349616},"koRange":null},{"id":71,"sourceUid":"merged-mv3g1gci-6","sourceNo":71,"originalSourceNo":332,"displayNo":71,"vi":"Tôi định để cô làm quản lý sáng tạo mà cô lại từ chức.\nDạ? Quản lý sáng tạo ạ?\nTRUYỀN THÔNG VC DANH SÁCH LÊN CHỨC QUẢN LÝ SÁNG TẠO\nCHUYÊN VIÊN CHO EUN JEONG\nQUẢN LÝ SÁNG TẠO ĐỘI SÁNG TẠO 2\nNhưng tôi mới có mười năm kinh nghiệm thôi mà. Thế này thì nhanh quá.\nCô nghỉ việc thì đành thôi.\nKhông ạ. Tôi làm được. Không gì là không thể!\nTưởng cô muốn nghỉ? Để lại đây rồi ra đi.","ko":"고아인: CD 달아 주려고 했더니 사표를 들고 왔네?\n조은정: 네? CD요? CD요?\n조은정: 저 이제 10년 차인데. 아직 너무 빠른데\n고아인: 그만둔다면 어쩔 수 없지\n조은정: 아니요. 할 수 있습니다! 못 할 것도 없죠\n고아인: 그만둔다며. 그거 두고 나가","en":"I was going to make you a creative director.\nSorry? A creative director?\nVC COMMUNICATIONS CREATIVE DIRECTOR PROMOTION LIST\nDEPUTY MANAGER CHO EUN-JEONG\nCREATIVE TEAM 2 CREATIVE DIRECTOR\nBut I only have ten years of experience. This is too fast.\nToo bad you're quitting.\nNo. I can do it. Of course!\nAren't you quitting? Give it to me and leave.","start":1222.362121,"end":1263.869402,"viStart":1187.878686,"viEnd":1230.180763,"koStart":1222.362121,"koEnd":1263.869402,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1187.878686,"end":1230.180763},"koRange":{"start":1222.362121,"end":1263.869402}},{"id":72,"sourceUid":"ko-muwto5ln-1297","sourceNo":72,"originalSourceNo":336,"displayNo":72,"vi":"[Âm nhạc thú vị]","ko":"[흥미로운 음악]","en":"[Interesting music]","start":1253.91,"end":1255.92,"viStart":1253.91,"viEnd":1255.92,"koStart":1253.91,"koEnd":1255.92,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":73,"sourceUid":"merged-mv3gqklc-14","sourceNo":73,"originalSourceNo":362,"displayNo":73,"vi":"Tôi không thể thăng chức cho người không biết lúc nào sẽ nghỉ.\nKhông. Tôi sẽ không bao giờ nghỉ việc. Tôi nói thật đấy ạ. Tôi xin hứa với chị.\nBỏ tay ra trước đã. Vâng.\nTôi không quan tâm đến lý do cô muốn nghỉ.\nVâng. Chị không cần biết đâu.\nKhông được bỏ giữa chừng đâu đấy. Vâng!\nTôi sẽ cố hết sức! Không. Đừng cố hết sức.\nTôi ghét nhất những người cố hết sức mà không được việc.\nCứ làm tốt thôi.\nTôi không quan tâm cô dùng cách thức hay thủ đoạn gì.\nNhất định phải đem kết quả tốt về. Biết chưa?","ko":"고아인: 언제 그만둘지 모르는 사람 CD 달아 줄 수 없으니까\n조은정: 아니요! 안 그만둡니다, 절대요. 진짜예요, 약속할 수 있습니다\n고아인: 일단 그거 치우고. 예\n고아인: 그만둔다고 했던 이유는 관심 없고\n조은정: 아, 예, 모르셔도 돼요\n고아인: 중간에 도망가면 안 돼, 알겠지? 네!\n조은정: 열심히 하겠습니다! 아니\n고아인: 열심히 하지 마. 일 못하면서 열심히 하는 애들 제일 꼴 보기 싫으니까. 그냥 잘해\n고아인: 수단, 방법 나 그런 거 상관없으니. 네!\n고아인: 무조건 좋은 거 들고 와, 알겠지?","en":"I can't promote someone who might quit at any time. No.\nI will never quit. I'm serious. I can promise.\nMove your fingers. Yes, ma'am.\nI'm not interested in why you wanted to quit. Yes. You shouldn't be. But you can't quit along the way.\nOf course! I'll try my best! No. Don't try your best.\nI hate those who try so hard when they're not talented. Just be the best.\nI don't care how you do it.\nMake sure you bring me the best. Yes, ma'am!","start":1263.869402,"end":1311.362985,"viStart":1230.180763,"viEnd":1281.117155,"koStart":1263.869402,"koEnd":1311.362985,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1230.180763,"end":1281.117155},"koRange":{"start":1263.869402,"end":1311.362985}},{"id":74,"sourceUid":"ko-muwto5ln-1311","sourceNo":74,"originalSourceNo":350,"displayNo":74,"vi":"[cười]","ko":"[피식 웃는다]","en":"[laughter]","start":1305.97,"end":1307.13,"viStart":1305.97,"viEnd":1307.13,"koStart":1305.97,"koEnd":1307.13,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":75,"sourceUid":"merged-mv3gws2i-15","sourceNo":75,"originalSourceNo":377,"displayNo":75,"vi":"Để tôi dọn thứ vớ vẩn này đi.\nNhưng mà Giám đốc Go ơi.\nTôi đột nhiên tò mò về một chuyện này.\nSao chị lại thăng chức cho tôi?\nThăng chức là tốt rồi, ai cần biết lý do chứ. Khoan đã nào.\nQuản lý sáng tạo Cho Eun Jeong.\nQuản lý sáng tạo Cho. Thế này thì nhanh quá.\nRa ăn cơm nào. Vâng! Vâng.","ko":"조문호: 아, 요 흉한 거는 제가 잘 치울게요\n조은정: 저, 근데요, 상무님\n조은정: 제가 갑자기 확 궁금해져서 그러는데요\n조은정: 저 왜 CD 달아 주시는 거예요?\n조은정: 되면 됐지, 이유가 뭐가 중요해. 가만있어 봐. 조은정 CD, CD, CD. 'CD님'. 아직 너무 이른데\n박정숙: 나와, 밥 먹자. 네!. 네","en":"I'll get rid of this awful thing. But Ms. Go.\nI am suddenly curious about this one thing.\nWhy are you promoting me?\nWhy I got promoted doesn't matter.\nWait a second. Creative Director Cho Eun-jeong. Creative Director Cho.\nThis is seriously too fast.\nCome out and eat. Okay! Okay.","start":1311.362985,"end":1384.591888,"viStart":1281.117155,"viEnd":1352.55776,"koStart":1311.362985,"koEnd":1384.591888,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1281.117155,"end":1352.55776},"koRange":{"start":1311.362985,"end":1384.591888}},{"id":76,"sourceUid":"merged-mv3weugl-5","sourceNo":76,"originalSourceNo":380,"displayNo":76,"vi":"[Tiếng cười của Eunjeong]\n[âm nhạc tươi sáng]\n[cười]\n[Cảm thán phấn khích]\n[Aji ngạc nhiên]","ko":"[은정의 웃음]\n[밝은 음악][웃음]\n[신난 탄성]\n[아지가 놀라며]","en":"[Eunjeong’s laughter]\n[bright music]\n[laughter]\n[Excited exclamation]\n[Aji is surprised]","start":1425.63,"end":1426.92,"viStart":1425.63,"viEnd":1426.92,"koStart":1425.63,"koEnd":1426.92,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":77,"sourceUid":"merged-mv3wmkgd-10","sourceNo":77,"originalSourceNo":389,"displayNo":77,"vi":"Mẹ cứ lo con không có hứng ăn, nhưng đúng là chẳng phải lo con kén ăn bao giờ.\nTại con đói mà mẹ. Hôm nay còn chẳng được ăn trưa.\nMẹ đừng vừa ăn vừa nói. Bất lịch sự lắm.\nNhìn mẹ này. Cho con xin thêm bát nữa. Được rồi.\nA Ji, thử ăn một thìa cơm với một thìa thịt đi.\nNhưng mẹ ăn một thìa cơm với hai thìa thịt mà.\nĐâu có. Mẹ ăn một thìa cơm với tận ba thìa thịt lận cơ.\nTrời ạ. Con bé Eun Jeong bị sốc nặng quá chăng?","ko":"박정숙: 우아… 입맛 없을까 봐 걱정했는데 우리 은정이는 참 먹성이 좋아\n조은정, 송아지: 배가 얼마나 고팠는데요 점심도 못 먹고. 엄마, 먹으면서 말하지 마\n송아지, 조은정: 더러워. 이거 봐라? 리필이요, 가득. 어, 그래\n조은정: 아지, 밥 한 번 고기 한 번 먹으라고\n송아지: 엄마는 밥 한 번 고기 두 번 먹잖아\n조은정: 아닌데? 엄마는 밥 한 번 고기 세 번 먹었는데. 아휴\n박정숙: 어휴, 은정이 쟤가 충격이 컸나?","en":"I was worried you wouldn't have an appetite, but I guess there's nothing to worry about.\nI was famished. I didn't even have lunch.\nDon't talk while you're eating.\nIt's gross. Look at this. Could I get a refill? Sure.\nA-ji, eat the meat once and rice once.\nBut you eat meat twice and rice once.\nThat's not true. I had meat three times and rice once.\nGosh. Eun-jeong must've had it rough.","start":1397.669068,"end":1439.988168,"viStart":1352.55776,"viEnd":1406.240764,"koStart":1397.669068,"koEnd":1439.988168,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1352.55776,"end":1406.240764},"koRange":{"start":1397.669068,"end":1439.988168}},{"id":78,"sourceUid":"merged-mv3yek0w-5","sourceNo":78,"originalSourceNo":396,"displayNo":78,"vi":"1 [Đàn hồi][Aji]\n2 [Bấm lưỡi]\n3 [Âm nhạc ý nghĩa]\n4 [Tiếng cười của Eunjeong]\n5 [Điện thoại di động rung]","ko":"1 [탄성][아지]\n2 [혀를 쯧쯧 찬다]\n3 [의미심장한 음악]\n4 [은정의 웃음]\n5 [휴대전화 진동음]","en":"1 [Elastic][Aji]\n2 [Clicks tongue]\n3 [Meaningful music]\n4 [Eunjeong’s laughter]\n5 [Mobile phone vibrates]","start":1475.72,"end":1476.93,"viStart":1475.72,"viEnd":1476.93,"koStart":1475.72,"koEnd":1476.93,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":79,"sourceUid":"merged-mv3yyaa6-18","sourceNo":79,"originalSourceNo":394,"displayNo":79,"vi":"Mình biết là con bé thích ăn…\nnhưng mới xin từ chức mà như vậy thì có tươi tắn quá không?\nAlô? Lát về con mua gà rán nhé.\nSao vậy ạ? Eun Jeong có gì đó lạ lắm. Lạ thế nào ạ? Giống hồi đó lắm.\nCó chuyện gì vui sao? Hôm nay cứ như mở tiệc ấy.\nEm có ổn không? Ổn chuyện gì? \nChuyện em nghỉ việc ấy. Đúng rồi. Em quên béng mất.\nKhông sao. Tốt lắm. Ăn cho quên đi.\nĐúng rồi. Chuyện không vui thì tốt nhất là quên đi. Nào. Vậy ạ?","ko":"박정숙: 아니, 아무리 먹을 거 앞이래도\n박정숙: 오늘 사표 낸 애치고는 표정이 너무 밝은데, 저거\n송정호, 박정숙: 여보세요? 야, 올 때 치킨 좀 사 와\n송정호, 박정숙: 왜요? 은정이가 이상해서 그래. 어떻게요? 그때 같아\n조은정: 뭔 일 있어? 응? 오늘 분위기 완전 고기고기 한데?\n송정호: 괜찮아? 뭐가? 사표 낸 거. 아…\n조은정: 그렇네. 내가 깜빡 잊고 있었네\n송정호: 아니야, 아니야 아니야, 아니야. 어, 훌륭해, 좋아\n박정숙: 언능 먹고 잊어. 그래, 안 좋은 일은 빨리 잊는 게 최고다, 자. 음, 그럴까요? 응. 아유","en":"I know she loves to eat…\nbut she seems too happy for someone who quit.\nHello? Bring home some chicken.\nWhy? Something's off about Eun-jeong. What do you mean? It's just like before.\nDo we have good news? We're having a meat party here today.\nAre you okay? You quit work today.\nYou're right. I totally forgot about it.\nNo, it's fine. That's great. Eat and move on.\nIt's best to move on from unpleasant memories. Here. Is that so?","start":1439.988168,"end":1519.337574,"viStart":1406.241,"viEnd":1484.680673,"koStart":1439.988168,"koEnd":1519.337574,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1406.241,"end":1484.680673},"koRange":{"start":1439.988168,"end":1519.337574}},{"id":80,"sourceUid":"merged-mv3ygnmm-8","sourceNo":80,"originalSourceNo":404,"displayNo":80,"vi":"1 [giọng yếu ớt] \n2 [Nhạc hài hước]\n3 [Giọng hài lòng của Eunjeong]\n4 [Jeongsuk thở hổn hển]","ko":"1 [힘없는 목소리로] \n2 [익살스러운 음악]\n3 [은정의 흡족한 소리]\n4 [정숙의 놀란 숨소리]","en":"1 [in a weak voice] \n2 [Humorous music]\n3 [Eunjeong’s satisfied voice]\n4 [Jeongsuk’s surprised gasp]","start":1500.49,"end":1502.5,"viStart":1500.49,"viEnd":1502.5,"koStart":1500.49,"koEnd":1502.5,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":81,"sourceUid":"merged-mv3yy34f-17","sourceNo":81,"originalSourceNo":419,"displayNo":81,"vi":"1 [Jeongsook cười ngượng nghịu]\n2 [Tiếng cười của Eunjeong]\n3 [Âm thanh hài lòng]","ko":"1 [정숙이 어색하게 웃으며]\n2 [은정의 웃음]\n3 [흡족한 소리]","en":"1 [Jeongsook laughs awkwardly]\n2 [Eunjeong’s laughter]\n3 [Satisfied sound]","start":1540.49,"end":1541.53,"viStart":1540.49,"viEnd":1541.53,"koStart":1540.49,"koEnd":1541.53,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":82,"sourceUid":"merged-mv3zmldx-31","sourceNo":82,"originalSourceNo":430,"displayNo":82,"vi":"Con bé hơi lạ nhỉ? Chắc cô ấy đau lòng lắm. Cứ lúc buồn, cô ấy lại như vậy.\nĐúng không? Hồi cô ấy bị trầm cảm sau sinh cũng y như vậy.\nTươi tỉnh rồi lại trầm uất. Hệt như lúc đó.\nCon sẽ để mắt đến cô ấy. Con biết cách mà.\nNếu có thịt để ăn… thì cô ấy sẽ vui vẻ.\nLàm gì vậy? Không mau lại đây là em ăn hết đùi đấy.\nEm ăn đi. Đầu, ức, bụng gì em cứ ăn hết.\nThật sao? Lát nữa đừng có nuốt lời đấy. Dĩ nhiên.","ko":"박정숙, 송정호: 좀 이상하지? 충격이 컸나 봐요 쟤 원래 힘들 때 저러잖아요\n송정호: 그렇지? 예전에 산후 우울증 때도 그랬잖아요\n박정숙: 어휴, 밝았다, 어두웠다. 똑같아\n송정호: 제가 잘 지켜볼게요, 방법 아니까\n송정호: 고기 앞에 앉혀 놓으면은 고기압 유지하잖아요\n조은정: 뭐 해! 빨리 안 오면 내가 다리 다 먹는다. 응, 먹어\n송정호: 머리, 가슴, 배 다 먹어\n조은정: 진짜? 나중에 딴소리하기 없기","en":"She's strange, right? She must've been torn. She does that when she's sad.\nRight? She acted like this when she had postnatal depression.\nShe's happy, then sad. It's just like back then.\nI'll keep an eye on her. I know the solution.\nWhen you bring her meat… she stays happy.\nWhat are you doing? If you don't come, I'm going to finish off the drumsticks.\nGo ahead. Eat the chicken all by yourself.\nReally? Don't go back on your word. Of course not.","start":1519.337574,"end":1568.281248,"viStart":1484.680673,"viEnd":1534.540755,"koStart":1519.337574,"koEnd":1568.281248,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1484.680673,"end":1534.540755},"koRange":{"start":1519.337574,"end":1568.281248}},{"id":83,"sourceUid":"merged-mv3zv8td-33","sourceNo":83,"originalSourceNo":440,"displayNo":83,"vi":"1 [Âm nhạc thú vị]\n2 [Giọng hài lòng của Eunjeong]\n3 [Độ đàn hồi của Eunjeong][Ain]\n4 [Âm nhạc bí mật]","ko":"1 [흥미로운 음악]\n2 [은정의 흡족한 소리]\n3 [은정의 탄성][아인]\n4 [비밀스러운 음악]","en":"1 [Interesting Music]\n2 [Eunjeong’s satisfied voice]\n3 [Eunjeong’s Elasticity][Ain]\n4 [Secret Music]","start":1599.59,"end":1602.26,"viStart":1599.59,"viEnd":1602.26,"koStart":1599.59,"koEnd":1602.26,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":84,"sourceUid":"merged-mv3zz41u-34","sourceNo":84,"originalSourceNo":439,"displayNo":84,"vi":"Đúng vậy. Mình phải chuẩn bị tử tế thì cô ta mới không nuốt lời.","ko":"고아인: 그렇지, 나중에 딴소리 못 하게 제대로 해 드려야지","en":"That's right. I should do this properly so she doesn't go back on her words.","start":1568.281248,"end":1574.799813,"viStart":1534.540755,"viEnd":1540.415404,"koStart":1568.281248,"koEnd":1574.799813,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1534.540755,"end":1540.415404},"koRange":{"start":1568.281248,"end":1574.799813}},{"id":86,"sourceUid":"merged-mv4idfok-4","sourceNo":86,"originalSourceNo":443,"displayNo":86,"vi":"Cô ta sẽ đảm nhận vai trò quan trọng.\nChí ít phải làm như vậy cho cô ta chứ.","ko":"고아인: 큰일 맡겨야 하니까\n고아인: 이 정도 당근은 먹여 드려야지","en":"She has a big role to play.\nThis is the least I can do for her.","start":1598.144938,"end":1608.294961,"viStart":1563.665027,"viEnd":1576.453247,"koStart":1598.144938,"koEnd":1608.294961,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1563.665027,"end":1576.453247},"koRange":{"start":1598.144938,"end":1608.294961}},{"id":88,"sourceUid":"merged-mv4idvbm-7","sourceNo":88,"originalSourceNo":445,"displayNo":88,"vi":"[Hết cơn ho]\n[Âm báo kết nối cuộc gọi]","ko":"[헛기침]\n[통화 연결음]","en":"[Clears cough]\n[Call connection tone]","start":1637.21,"end":1639.05,"viStart":1637.21,"viEnd":1639.05,"koStart":1637.21,"koEnd":1639.05,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":89,"sourceUid":"merged-mv4iefkj-10","sourceNo":89,"originalSourceNo":447,"displayNo":89,"vi":"Chào Phóng viên Kim. Xin lỗi vì gọi anh giờ này.\nTôi muốn đề xuất cho anh một nguồn tin hay để anh lên bài.","ko":"고아인: 안녕하세요, 기자님 늦은 시간에 죄송합니다\n고아인: 제가 좋은 기삿거리 하나 소개시켜 드리려고 하는데요","en":"Hello Mr. Kim. I'm sorry to call you at this hour.\nBut I would like to give you a good source for an article.","start":1617.059576,"end":1624.730869,"viStart":1582.678603,"viEnd":1590.370213,"koStart":1617.059576,"koEnd":1624.730869,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1582.678603,"end":1590.370213},"koRange":{"start":1617.059576,"end":1624.730869}},{"id":90,"sourceUid":"merged-mv4j34qy-20","sourceNo":90,"originalSourceNo":456,"displayNo":90,"vi":"Hôm qua, giám đốc sáng tạo mới đã có hành động bộc phát.\nTôi xin phép thay mặt cô ấy xin lỗi các anh.\nĐó là email của giám đốc sáng tạo ư?\nVâng. Đó là hành động độc đoán cô ta gây ra mà chưa hề có sự bàn bạc.\nVậy giám đốc sáng tạo đó mới phải là người đứng ra xin lỗi chứ.\nNếu cô ta là người biết xin lỗi, thì đời nào lại gửi email đó.\nVậy anh gọi bọn tôi đến đây làm gì?","ko":"어제 있었던. 신임 제작 본부장의 돌발 행동은\n최창수, 본사상무: 제가 대신해서 사과드리겠습니다. 제작 본부장이 보낸 거라고요?\n최창수: 예. 상의 없이. 독단적으로 저지른 일입니다\n본사상무: 그럼 당사자인 제작 본부장이 직접 와서 사과를 해야죠\n최창수: 상무님. 사과하러 올 타입이면\n최창수: 그런 사고를 쳤겠습니까?\n본사상무: 그럼 뭐 하러 보자고 한 겁니까?","en":"Yesterday, the new chief creative officer unexpectedly acted out.\nI would like to apologize on her behalf.\nThe chief creative officer sent that email?\nYes, sir. She committed such an action all by herself without any discussion.\nThen she should be the one to come and apologize.\nIf she were the type to apologize, she wouldn't have sent that email.\nThen why did you call us?","start":1624.730869,"end":1665.558,"viStart":1593.608728,"viEnd":1631.529199,"koStart":1624.730869,"koEnd":1665.558,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1593.608728,"end":1631.529199},"koRange":{"start":1624.730869,"end":1665.558}},{"id":91,"sourceUid":"merged-mv563eyo-6","sourceNo":91,"originalSourceNo":463,"displayNo":91,"vi":"Chúng ta đâu thể bỏ qua chuyện này được.\nAi không nghe lời thì phải chịu phạt.\nVậy anh có chịu trách nhiệm được không nếu người ta lại bảo bọn tôi lộng quyền?\nAnh cứ việc đến, không cần phải lo.\nTôi sẽ thu xếp để anh có thể đến mà không gặp trở ngại nào.","ko":"최창수: 그냥 넘어갈 문제는 아니잖습니까\n최창수: 말을 안 들으면 매질을 해야죠\n본사상무: 아니, 그러다가 또 광고주 갑질이네 뭐네 하면 책임질 수 있습니까?\n최창수: 걱정 마시고 오십시오\n최창수: 편안하게 문책하실 수 있는 상황 준비해 놓겠습니다","en":"This incident isn't something we should overlook.\nYou must punish those who don't listen.\nWill you take responsibility if we're accused again of going on a power trip?\nPlease don't worry and come.\nI'll prepare everything so that you can visit us without a hitch.","start":1665.131753,"end":1684.28071,"viStart":1631.529199,"viEnd":1651.088178,"koStart":1665.131753,"koEnd":1684.28071,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1631.529199,"end":1651.088178},"koRange":{"start":1665.131753,"end":1684.28071}},{"id":92,"sourceUid":"ko-muwto5lo-1419","sourceNo":92,"originalSourceNo":458,"displayNo":92,"vi":"[âm nhạc đen tối]","ko":"[어두운 음악]","en":"[dark music]","start":1691.43,"end":1692.81,"viStart":1691.43,"viEnd":1692.81,"koStart":1691.43,"koEnd":1692.81,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":93,"sourceUid":"merged-mv57gr42-12","sourceNo":93,"originalSourceNo":472,"displayNo":93,"vi":"Bọn tôi trực tiếp đến đó sao? Như vậy sẽ tốt hơn ư?\nTRUYỀN THÔNG VC\nKhông có cách nào? Chủ tịch của Woowon bị bắt.\nMà các anh không tìm được nổi một cách để ông ấy được tại ngoại trước khi đưa ra xét xử sao?\nTrưởng phòng Kim. Đội pháp lý bên Woowon và công ty luật của họ đã xem xét tất cả các điều kiện pháp lý rồi.\nWoowon bó tay thì chúng ta cũng vậy sao?","ko":"본사상무: 직접 간다? 그게 낫겠나?\n\"VC그룹\"\n김태완: 방법이 없다? 구속된 우원 회장님 불구속 상태로 재판받게 하는 거 겨우 그게 안 된다는 겁니까?\n법무팀장: 실장님, 법리적인 검토는 우원 쪽 법무 팀이랑 담당 로펌에서 수도 없이 했습니다\n김태완: 우원이 못 하면 우리도 못 해야 하는 겁니까?","en":"You want us to visit ourselves?\nDo you think that's better?\nThere is no way? The chairman of Woowon has been arrested.\nAnd you can't even find a way to get him into court without being arrested?\nMr. Kim. Woowon Group's legal team and their law firm already reviewed all the legal possibilities.\nDoes that mean we can't find a way?","start":1684.28071,"end":1715.394,"viStart":1651.088178,"viEnd":1681.232102,"koStart":1684.28071,"koEnd":1715.394,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1651.088178,"end":1681.232102},"koRange":{"start":1684.28071,"end":1715.394}},{"id":94,"sourceUid":"merged-mv5b6ph8-26","sourceNo":94,"originalSourceNo":480,"displayNo":94,"vi":"Ông ấy đã bị bắt giam rồi nên chúng tôi cũng không…\nKhông có cách nào… Anh không muốn đi làm nữa à?\nKhi anh là công tố viên trưởng và cấp dưới đến bảo anh,\n\"Công tố viên trưởng, tôi hết cách rồi.\"\nThì anh sẽ trả lời, \"À, thì ra là hết cách rồi.\"\nNhư vậy sao? Chuyện là… Công tố viên đang phụ trách vụ Woowon là tên điên có tiếng.\nNghe này.","ko":"법무팀장: 이미 구속된 상황이라 달리 방법이 없어서…\n김태완: 없다고 하면 회사 생활 끝납니까?\n김태완: 팀장님은 지검장 하실 때 부하 검사가 와서\n김태완: '지검장님, 방법이 없습니다' 하면\n김태완: '아… 방법이 없구나' 이랬습니까?\n법무팀장: 아니, 그게 지금 우원 쪽 사건 물고 있는 애가 워낙 유명한 또라이라서…\n김태완: 팀장님?","en":"He's already been arrested, so we don't have any way of--\nDoes that mean… you've done your job properly?\nWhen you were a district chief and a prosecutor came and said,\n\"Sir, I can't find a way.\"\nDid you answer, \"I see. So there's no way.\"\nDid you? Well… The prosecutor who's in charge of the Woowon case is a total lunatic.\nListen.","start":1715.394,"end":1748.055587,"viStart":1681.232102,"viEnd":1714.201535,"koStart":1715.394,"koEnd":1748.055587,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1681.232102,"end":1714.201535},"koRange":{"start":1715.394,"end":1748.055587}},{"id":95,"sourceUid":"ko-muwto5lo-1437","sourceNo":95,"originalSourceNo":476,"displayNo":95,"vi":"[âm nhạc đen tối]","ko":"[어두운 음악]","en":"[dark music]","start":1746.95,"end":1748.91,"viStart":1746.95,"viEnd":1748.91,"koStart":1746.95,"koEnd":1748.91,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":96,"sourceUid":"merged-mv5bmebz-37","sourceNo":96,"originalSourceNo":501,"displayNo":96,"vi":"Vâng.\nXe công ty của anh là thứ mà Tổng trưởng công tố, không, đến Bộ trưởng Bộ Tư pháp cũng không lái nổi.\nVâng. Trong năm ngoái, lương công ty trả anh nhiều hơn cả lương công tố 25 năm của anh gộp lại.\nĐúng vậy. Thế nhưng anh lại không xử lý nổi một tên công tố lương ba cọc ba đồng?\nCái đó… Làm sao cho đáng tiền đi.\nAnh đâu còn là công chức nhà nước như xưa nữa mà muốn ngồi mát ăn bát vàng.\nĐây là công ty. Ở đây chỉ coi trọng thành tích và kết quả.\nCông ty là vậy. Anh hãy tìm cách đi.\nTốn bao nhiêu tiền cũng được.","ko":"법무팀장: 네, 실장님\n김태완: 회사에서 제공하는 자동차가 검찰 총장, 아니다\n김태완: 법무부 장관도 못 타는 차잖아요, 맞죠? 네\n김태완: 작년 1년 동안 우리 회사에서 받은 돈이\n김태완: 검사 25년 하시면서 받은 총연봉보다 많고요\n김태완: 그렇죠. 근데 연봉 5천 받는 검사 하나 핸들링 못 한다고요?\n김태완: 그게… 돈값은 하셔야죠 이제는 받은 만큼 일 못 해도 정년 보장 되는\n김태완: 공무원 아니지 않습니까. 네?\n김태완: 여기 회사예요. 실적과 결과가 전부인 회사. 방법 찾아내세요\n김태완: 돈은 얼마든지 써도 되니까","en":"Yes, sir. Your company car is something that the Prosecutor General or even the Minister of Justice can't afford to drive.\nRight. Last year, you've been paid more by us than your 25-year salary combined as a prosecutor.\nYou're right. Yet you're saying you can't deal with a lowly prosecutor?\nWell… Do your money's worth.\nYou can't keep your job when you've failed to do your work.\nThis isn't some civil service.\nThis is a company. Performance and results are everything.\nEverything. Find a way. You can spend as much money as you need.","start":1748.055587,"end":1803.881737,"viStart":1714.201535,"viEnd":1769.862086,"koStart":1748.055587,"koEnd":1803.881737,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1714.201535,"end":1769.862086},"koRange":{"start":1748.055587,"end":1803.881737}},{"id":97,"sourceUid":"ko-muwto5lo-1459","sourceNo":97,"originalSourceNo":498,"displayNo":97,"vi":"[âm nhạc đen tối]","ko":"[어두운 음악]","en":"[dark music]","start":1817.27,"end":1818.48,"viStart":1817.27,"viEnd":1818.48,"koStart":1817.27,"koEnd":1818.48,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":98,"sourceUid":"merged-mv5d4uho-3","sourceNo":98,"originalSourceNo":515,"displayNo":98,"vi":"Tôi tin anh.\nĐược. Tôi sẽ cố gắng hết sức.\nNếu anh bị tổn thương bởi những gì tôi vừa nói, thì cứ nghĩ là do tình hình đang nguy cấp đi.\nÝ tôi là anh đừng để bụng.\nTất nhiên rồi. Trong quá trình làm việc cũng phải có lúc khó khăn chứ.\nKết quả tốt mới vui vẻ làm việc được. Mọi người hiểu mà.\nVâng. Tôi có hẹn, xin phép đi trước.","ko":"김태완: 믿습니다\n법무팀장: 네, 최선을 다해 보겠습니다\n김태완: 혹시나 제가 말이 좀 과했으면 그만큼 상황이 심각해서 그런 거니까\n김태완: 앙심 같은 거 품지 마시고요\n김태완: 그럼요. 아, 뭐, 일하다 보면 그럴 수도 있는 거죠\n김태완: 결과가 좋아야 좋게 일할 수 있습니다 다들 아시죠?\n김태완: 예. 약속 있어서 그럼 먼저","en":"I trust you.\nYes, sir. I'll try my best.\nIf you feel that my words were too harsh, it's because of the dire situation.\nSo don't hold any grudges.\nNo worries. Things happen when you're working.\nWe can only work well when there are good results.\nYes, sir. I have an appointment, so excuse me.","start":1808.269804,"end":1838.051394,"viStart":1769.862086,"viEnd":1803.861927,"koStart":1808.269804,"koEnd":1838.051394,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1769.862086,"end":1803.861927},"koRange":{"start":1808.269804,"end":1838.051394}},{"id":99,"sourceUid":"ko-muwto5lo-1474","sourceNo":99,"originalSourceNo":513,"displayNo":99,"vi":"[Tiếng đặt bút xuống]","ko":"[펜 탁 내려놓는 소리]","en":"[Sound of pen being put down]","start":1869.28,"end":1870.24,"viStart":1869.28,"viEnd":1870.24,"koStart":1869.28,"koEnd":1870.24,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":100,"sourceUid":"merged-mv5f1qk0-13","sourceNo":100,"originalSourceNo":524,"displayNo":100,"vi":"Các cô các cậu. Làm ăn kiểu gì vậy? Hả?\nChúng ta đã bỏ lỡ điều gì đó nên mới rơi vào cảnh này đấy!\nĐúng rồi đó. Cách Hàn Quốc tạo ra kỳ tích sông Hán chính là đây.\nNghiên cứu kỹ lại từ đầu về điều kiện tại ngoại đi.\nCấp trên phải thúc đẩy thì cấp dưới mới chịu hành động.\nĐừng chỉ biết nói không thể!\nĐược, gặp nhau ở đó nhé.\nKhông ai được về nhà trước khi tìm ra cách.","ko":"법무팀장: 니들 일 이따위로 할래? 어?\n법무팀장: 우리가 뭔가 놓친 게 있으니까 이 모양 이 꼴이잖아!\n김태완: 그렇지. 이게 바로 한강의 기적을 만든 원동력이지\n법무팀장: 보석 허가 조건 처음부터 다시 한번 살펴봐, 어?\n김태완: 위에서 조져야 아래에서 움직인다니까\n법무팀장: 안 된다는 말 하지 말고!\n김태완: 응, 어, 거기서 봐\n법무팀장: 방법 찾아낼 때까지 오늘 다들 집에 못 가","en":"All of you. Is this the best you can do? Is it?\nThings are this way because we've missed something!\nThere you go. This is what brought about Korea's rapid economic development.\nLook into the bail requirements again.\nThe top needs to push those below to get things going.\nStop saying that you can't!\nHey, I'll meet you there.\nUntil we find a way, no one is going home.","start":1847.684426,"end":1880.673029,"viStart":1813.679523,"viEnd":1847.569047,"koStart":1847.684426,"koEnd":1880.673029,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1813.679523,"end":1847.569047},"koRange":{"start":1847.684426,"end":1880.673029}},{"id":101,"sourceUid":"merged-mv5y7p3n-5","sourceNo":101,"originalSourceNo":528,"displayNo":101,"vi":"1 [Âm nhạc đen tối]\n2 [Chim hót líu lo]\n3 [Âm thanh vận hành khóa cửa] [Yên tĩnh]\n4 [Tiếng đóng cửa]\n5 [Âm thanh vận hành khóa cửa]","ko":"1 [어두운 음악]\n2 [새가 지저귄다]\n3 [도어 록 작동음][정숙]\n4 [문 닫히는 소리]\n5 [도어 록 작동음]","en":"1 [Dark Music]\n2 [Birds chirping]\n3 [Door lock operating sound][Quiet]\n4 [Door closing sound]\n5 [Door lock operating sound]","start":1912.91,"end":1913.74,"viStart":1912.91,"viEnd":1913.74,"koStart":1912.91,"koEnd":1913.74,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":102,"sourceUid":"merged-mv5ybn2q-11","sourceNo":102,"originalSourceNo":536,"displayNo":102,"vi":"Mẹ đi làm đây. Ôi trời.\nMẹ tiếp quản công việc tốt nhé. Là \"bàn giao công việc\". À vâng, đúng vậy.\nCon đi đây ạ. Được rồi. Con đi đi. Tạm biệt mẹ nhé.\nMình vào nhà thôi. Đi nào.","ko":"조은정: 엄마 갔다 올게… 아이고, 아이고, 아이고\n송아지, 박정숙: 인수인수 잘해. 아이고, 인수인계. 어, 그거, 그거\n조은정, 송아지: 다녀올게요. 그래, 갔다 와. 엄마, 빠이빠이\n박정숙: 들어가자, 들어와. 어, 가자","en":"I'm off, A-ji. Goodness.\nGood luck taking over the job. It's \"handing over.\"\nRight, that. I'll be off.\nOkay. Go on then. Bye, Mom.\nLet's go back in. Come on.","start":1883.553664,"end":1906.056703,"viStart":1847.569047,"viEnd":1869.30873,"koStart":1883.553664,"koEnd":1906.056703,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1847.569047,"end":1869.30873},"koRange":{"start":1883.553664,"end":1906.056703}},{"id":103,"sourceUid":"merged-mv5ybt3n-12","sourceNo":103,"originalSourceNo":540,"displayNo":103,"vi":"1 [Tiếng đóng cửa]\n2 [Âm thanh vận hành khóa cửa]\n3 [Nhạc tươi sáng]\n4 [ồn ào]\n5 [âm thanh khẩn cấp]","ko":"1 [문 닫히는 소리]\n2 [도어 록 작동음]\n3 [밝은 음악]\n4 [콧노래를 부른다]\n5 [다급한 소리]","en":"1 [Door closing sound]\n2 [Door lock operating sound]\n3 [Bright music]\n4 [humming]\n5 [urgent sound]","start":1937.18,"end":1938.93,"viStart":1937.18,"viEnd":1938.93,"koStart":1937.18,"koEnd":1938.93,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":104,"sourceUid":"merged-mv5z9orm-22","sourceNo":104,"originalSourceNo":554,"displayNo":104,"vi":"Giờ mình đã là quản lý sáng tạo rồi, không được chạy.\nHay là đi làm bằng taxi cho thanh lịch?\nCó mà điên. Tiền đó mua được hai con gà rán đấy.\nChờ tôi với! Cảm ơn. Xin lỗi, cho tôi nhờ đến lúc xe xuất phát nhé?\nÔi, lại gặp cô rồi. Cô có mang ghế không?\nCó chứ. Hôm nay tôi phải đi làm sớm. Đã có chuyện gì à?\nĐúng là trên đời này chuyện gì cũng có thể xảy ra.","ko":"조은정: 아, 이젠 CD인데 품위 없이 뛰어?\n조은정: 아니야, 아니야 그냥 고고하게 택시 타고 출근하면\n조은정: 음, 미쳤지 택시비면 치킨이 두 마리인데\n조은정: 잠깐만요! 감사합니다. 죄송해요. 저, 출발할 때까지만 좀…\n조은정, 여자: 또 보네요? 오늘도 의자 챙기셨어요? 아, 그럼요\n조은정: 오늘은 진짜 일찍 가야 되거든요\n여자: 무슨 일 있으세요?\n조은정: 아니, 진짜 살다 살다 별일이 다 있는 게요","en":"I shouldn't run now that I'm a creative director.\nWhat if I get to work elegantly in a taxi?\nThat's crazy. The taxi fare can buy me two chickens.\nHold on! Thank you. Sorry, can I stay here until the bus starts going?\nNice to see you again. Do you have the chair? Of course. I have to get to work early today.\nIs something wrong? Something totally unexpected happened.","start":1923.61357,"end":1967.395088,"viStart":1877.023767,"viEnd":1932.434086,"koStart":1923.61357,"koEnd":1967.395088,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1877.023767,"end":1932.434086},"koRange":{"start":1923.61357,"end":1967.395088}},{"id":105,"sourceUid":"merged-mv5z5n8e-17","sourceNo":105,"originalSourceNo":548,"displayNo":105,"vi":"[Âm thanh nhận dạng thẻ]\n[Người phụ nữ 1] Hả? [Eunjeong] Hả?\n[Người phụ nữ 1 cười] [Nhạc tươi sáng]\n[Người phụ nữ 1 ngạc nhiên]","ko":"[카드 인식음]\n[여자1] 어? [은정] 어?\n[여자1의 웃음][밝은 음악]\n[여자1이 놀라며]","en":"[Card recognition sound]\n[Woman 1] Huh? [Eunjeong] Huh?\n[Woman 1 laughs] [Bright music]\n[Woman 1 is surprised]","start":1974.34,"end":1975.39,"viStart":1974.34,"viEnd":1975.39,"koStart":1974.34,"koEnd":1975.39,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":106,"sourceUid":"merged-mv6g74l3-32","sourceNo":106,"originalSourceNo":567,"displayNo":106,"vi":"Tôi mới được thăng chức.\nThật sao? Chúc mừng cô nhé.\nÔi, nhẹ nhõm quá đi mất.\nTôi muốn khoe với tất cả mọi người, nhưng về nhà lại không dám mở lời.\nSao lại thế? Đại khái chuyện là thế này…\nNhưng tôi lỡ nói dối con trai mình là tôi đã xin nghỉ việc.\nTrời ạ. Ôi không. Điểm nhấn của việc lên chức là được khoe khoang với mọi người mà.\nĐúng đấy.","ko":"조은정, 여자: 제가 이번에 승진했거든요? 진짜요? 축하해요\n조은정: 아, 속 시원해. 아니, 자랑하고 싶어 죽겠는데 집에선 승진했다고 말도 못 하고\n여자: 왜요? 무슨 일이 있었냐면요\n조은정: 근데 애한테는 사표를 냈다고 거짓말을 해 버려 가지고\n여자: 아니, 승진보다 기분 좋은 게 승진했다고 자랑하는 건데\n조은정: 아, 그렇죠? 아, 아니","en":"I got promoted recently.\nReally? Congratulations.\nGosh, that's refreshing. I want to tell everyone about it, but I can't say anything at home.\nWhy not? So what happened was…\nBut I lied to my son that I quit my job.\nGoodness. Oh, no. The whole point of a promotion is to boast about it to everyone.\nTell me about it.","start":1967.395088,"end":2001.23668,"viStart":1932.434086,"viEnd":1966.032298,"koStart":1967.395088,"koEnd":2001.23668,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1932.434086,"end":1966.032298},"koRange":{"start":1967.395088,"end":2001.23668}},{"id":107,"sourceUid":"merged-mv5zgqb1-30","sourceNo":107,"originalSourceNo":564,"displayNo":107,"vi":"[thở dài]\n[Hành khách thở dài]","ko":"[한숨]\n[승객들의 탄식]","en":"[sigh]\n[Passengers sigh]","start":2016.13,"end":2018.14,"viStart":2016.13,"viEnd":2018.14,"koStart":2016.13,"koEnd":2018.14,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":108,"sourceUid":"merged-mv6jgdqk-12","sourceNo":108,"originalSourceNo":579,"displayNo":108,"vi":"Tôi diễn xuất giả trân mà vẫn phải giả vờ đau khổ ở nhà.\nCon tôi sáng nào cũng khóc.\n\"Mẹ, mẹ đừng đi làm nữa.\"\nCon tôi cũng thế. Chúng ta ra ngoài kiếm tiền, nhưng lại là tội đồ ở nhà.\nĐúng đấy. Thiệt tình. Trời ạ.\nChúng ta cùng cố lên!\nCố hết sức… Cô ngồi xuống đi.\nNhưng mà, sao chỗ đó có ba người?\nNgười đang trốn sau ghế. Chỗ của cô ở đâu?\nAnh ấy thấy rồi à?","ko":"조은정: 집에서는 슬픈 척 되지도 않는 발 연기 하느라고, 아휴\n조은정: 우리 애도 아침마다 울어요\n여자: '엄마, 회사 가지 마' 이러면서\n조은정: 우리 애도요. 돈 벌어다 주면서 죄인 취급이나 받고, 어휴. 그러게요\n조은정: 우리 다들 힘내요, 힘내서!\n운전기사: 앉으세요. 근데 거긴 왜 세 분이에요?\n운전기사: 거기 숨은 분, 자리 어디예요? 씨… 보여요?","en":"I had to put on this terrible act at home so that I'd seem sad.\nMy kid cries every morning too.\n\"Mom, don't go to work.\"\nMy kid says that too. We're the sinner when we bring home the bacon.\nTell me about it. Seriously.\nGoodness. Let's all cheer up!\nLet's cheer up and-- Sit down!\nActually, why are there three of you?\nThe one hiding behind the chair. Where's your seat? Can he see me?","start":2001.23668,"end":2036.197984,"viStart":1966.032298,"viEnd":2002.271832,"koStart":2001.23668,"koEnd":2036.197984,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1966.032298,"end":2002.271832},"koRange":{"start":2001.23668,"end":2036.197984}},{"id":109,"sourceUid":"merged-mv6jghox-13","sourceNo":109,"originalSourceNo":580,"displayNo":109,"vi":"[Người phụ nữ 1][Hành khách phản hồi]\n[Âm nhạc sôi động] [Tài xế xe buýt]\n[Giọng ngượng ngùng của Eunjeong]\n[Âm nhạc ý nghĩa]","ko":"[여자1][승객들이 호응한다]\n[흥미진진한 음악][버스 기사]\n[은정의 당황한 소리]\n[의미심장한 음악]","en":"[Woman 1][Passengers respond]\n[Exciting music] [Bus driver]\n[Eunjeong’s embarrassed voice]\n[Meaningful music]","start":2078.7,"end":2080.36,"viStart":2078.7,"viEnd":2080.36,"koStart":2078.7,"koEnd":2080.36,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":110,"sourceUid":"merged-mv6kcfp0-21","sourceNo":
